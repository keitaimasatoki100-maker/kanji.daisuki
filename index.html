<!doctype html>
<html lang="ja">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>漢字練習サイト</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
        * { font-family: 'UD デジタル 教科書体 N-R', 'UD Digi Kyokasho N-R', '教科書体', 'BIZ UDPGothic', sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; margin: 0; padding: 10px; display: flex; justify-content: center; align-items: flex-start; writing-mode: vertical-rl; text-orientation: upright; padding-top: 10px; box-sizing: border-box; overflow-x: auto; }
        .container { background: white; border-radius: 20px; padding: 15px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); max-height: 95vh; height: 100%; text-align: center; writing-mode: vertical-rl; text-orientation: upright; overflow-y: auto; overflow-x: auto; margin-top: 0; position: relative; display: flex; flex-direction: column; align-items: flex-start; }
        #headerArea, #readHeaderArea, #kanjiPracticeHeaderArea { margin-bottom: 20px; display: flex; flex-direction: row; align-items: flex-start; gap: 15px; writing-mode: vertical-rl; text-orientation: upright; z-index: 100; flex-shrink: 0; }
        #cardsArea, #readCardsArea, #kanjiPracticeContentArea { display: flex; flex-direction: column; flex-wrap: wrap; align-content: flex-start; height: 100%; overflow-x: auto; padding: 10px 0; }
        .title-text { color: #4a5568; font-size: 0.6rem; font-weight: bold; margin: 0; writing-mode: vertical-rl; text-orientation: upright; line-height: 1.2; }
        .sentence-card { background: #f7fafc; border-radius: 15px; padding: 15px; margin: 40px 10px 10px 10px; border-top: 5px solid #667eea; writing-mode: vertical-rl; text-orientation: upright; display: inline-block; vertical-align: top; min-height: 60vh; max-height: 85vh; width: 55px; position: relative; flex-shrink: 0; }
        .sentence { font-size: 1.5rem; line-height: 1.8; color: #2d3748; writing-mode: vertical-rl; text-orientation: upright; margin-top: 10px; }
        .problem-number { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); font-size: 1.2rem; font-weight: bold; color: #667eea; background: white; padding: 5px 10px; border-radius: 15px; border: 2px solid #667eea; writing-mode: vertical-rl; text-orientation: upright; }
        .top-menu { display: flex; flex-direction: column; gap: 25px; margin-right: 15%; }
        .top-menu-btn { width: 90px; height: 360px; padding: 30px 10px; font-size: 1.4rem; font-weight: bold; border: none; border-radius: 20px; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.15); transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; line-height: 1.4; letter-spacing: 0.1em; box-sizing: border-box; }
        .top-menu-btn:hover { transform: translateX(-5px); box-shadow: 0 15px 25px rgba(0,0,0,0.2); }
        .btn-flashcard { background: white; color: #ed8936; border: 4px solid #ed8936; }
        .btn-read { background: white; color: #48bb78; border: 4px solid #48bb78; }
        .btn-write { background: white; color: #4299e1; border: 4px solid #4299e1; }
        .btn-print { background: white; color: #8b5cf6; border: 4px solid #8b5cf6; }
        .btn-minigame { background: white; color: #d53f8c; border: 4px solid #d53f8c; }
        .btn-kanji-practice { background: white; color: #e53e3e; border: 4px solid #e53e3e; }
        .kanji-practice-unit-section { display: flex; flex-direction: column; align-items: flex-start; gap: 15px; margin-left: 40px; }
        .kanji-practice-unit-title { font-size: 1.5rem; color: #4a5568; margin: 0; font-weight: bold; border-left: 4px solid #cbd5e0; padding-left: 10px; writing-mode: vertical-rl; white-space: nowrap; }
        .kanji-practice-btn-container { display: grid; grid-template-columns: repeat(5, 60px); gap: 15px; }
        .kanji-practice-btn { background: white; border: 2px solid #e53e3e; color: #e53e3e; font-size: 2rem; width: 60px; height: 60px; border-radius: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: all 0.2s; font-family: 'Klee One', 'UD デジタル 教科書体 N-R', serif; writing-mode: horizontal-tb; padding: 0; }
        .kanji-practice-btn:hover { transform: scale(1.1); background: #fff5f5; box-shadow: 0 6px 12px rgba(229, 62, 62, 0.2); }
        .dialog-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 5000; align-items: center; justify-content: center; writing-mode: horizontal-tb; }
        .dialog-content { background: white; padding: 25px; border-radius: 20px; max-width: 450px; width: 90%; display: flex; flex-direction: column; align-items: center; max-height: 90vh; overflow-y: auto; }
        .btn-blue { background: #3182ce; color: white; border: none; padding: 10px 20px; border-radius: 25px; cursor: pointer; font-weight: bold; }
        .loading-spinner { width: 16px; height: 16px; border: 2px solid #ffffff; border-top: 2px solid transparent; border-radius: 50%; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .reading-input { writing-mode: vertical-rl; text-orientation: upright; width: 1.5em; font-size: 1.2rem; border: 2px dashed #cbd5e0; border-radius: 6px; text-align: center; padding: 4px 0; outline: none; background: white; }
        .reading-input.correct { border-color: #48bb78; background: #f0fff4; }
        .kanji-blank { display: inline-flex; flex-direction: row; align-items: center; justify-content: center; width: 40px; min-height: 40px; border: 2px dashed #cbd5e0; border-radius: 8px; margin: 20px 2px 2px 2px; vertical-align: middle; background: white; position: relative; transition: all 0.3s ease; padding: 8px 0; text-align: center; writing-mode: vertical-rl; text-orientation: upright; }
        .kanji-blank.revealed { border: 2px solid #48bb78; background: #f0fff4; color: #2d3748; font-weight: bold; }
        .controls { margin-right: 15px; display: flex; flex-direction: row; align-items: center; gap: 15px; writing-mode: vertical-rl; text-orientation: upright; flex-shrink: 0; padding-top: 20px; }
        .progress { margin-right: 10px; font-size: 1.1rem; color: #4a5568; font-weight: bold; writing-mode: vertical-rl; text-orientation: upright; }
        #celebration-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(255, 255, 255, 0.2); pointer-events: none; z-index: 9999; display: none; writing-mode: horizontal-tb; }
        .kusudama-container { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
        .kusudama { font-size: 120px; animation: shake 0.5s infinite alternate; }
        .kusudama.open { animation: openBall 0.8s forwards; display: flex; gap: 10px; }
        @keyframes shake { from { transform: rotate(-10deg); } to { transform: rotate(10deg); } }
        @keyframes openBall { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); opacity: 0; } }
        .congratulations-text { font-size: 3rem; font-weight: bold; color: #ff4500; text-shadow: 2px 2px 10px rgba(0,0,0,0.2); margin-top: 20px; opacity: 0; transform: translateY(20px); animation: fadeInUp 0.5s 0.5s forwards; }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        .confetti { position: absolute; width: 10px; height: 10px; background: #f00; animation: fall 3s linear infinite; }
        @keyframes fall { to { transform: translateY(100vh) rotate(360deg); } }
        .mode-switch-btn { position: fixed; left: 20px; top: 20px; background: linear-gradient(135deg, #ed8936, #dd6b20); color: white; border: none; padding: 20px 12px; border-radius: 15px; font-size: 1.1rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 1000; writing-mode: vertical-rl; text-orientation: upright; transition: transform 0.2s; }
        .mode-switch-btn:hover { transform: scale(1.05); }
        .fc-card-container { width: 350px; max-width: 90%; height: 85vh; max-height: 1200px; margin: 0 20px; }
        .fc-card-inner { width: 100%; height: 100%; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }
        @media (max-width: 600px) { .container { padding: 20px; margin: 10px; } .sentence { font-size: 1.2rem; } .fc-card-container { width: 280px; height: 85vh; } .fc-card-inner { padding: 20px; } .top-title { position: static; transform: none; font-size: 1.6rem; margin-right: 20px; white-space: nowrap; } .top-menu { margin-right: 0; gap: 10px; flex-direction: column; } .top-menu-btn { width: 60px; height: 280px; font-size: 1.1rem; padding: 15px 5px; } }
        /* 印刷用スタイル */
        @media print {
            @page { size: A4 landscape; margin: 0; }
            body { background: white !important; margin: 0 !important; padding: 0 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            #topPage, #mainContainer, #readingContainer, #flashcardPage, #minigameMenuPage, #minigamePlayPage, #backToTopBtnMain, #celebration-overlay, #editDialog, #kanjiDetailModal, #kanjiPracticeContainer, .print-controls, .print-hint { display: none !important; }
            #printPage { display: block !important; position: static !important; width: auto !important; height: auto !important; background: white !important; overflow: visible !important; }
            #printAreaWrapper { margin: 0 !important; padding: 0 !important; display: block !important; max-width: none !important; gap: 0 !important; }
            .page-wrapper { margin: 0 auto !important; padding: 0 !important; width: 297mm !important; height: 210mm !important; page-break-after: always !important; break-after: page !important; box-shadow: none !important; }
            .page-wrapper:last-child { page-break-after: auto !important; break-after: auto !important; }
            .print-area-page { box-shadow: none !important; margin: 0 !important; width: 297mm !important; height: 210mm !important; flex-direction: row-reverse; display: flex; padding: 10mm; box-sizing: border-box; font-family: 'Klee One', 'UD デジタル 教科書体 N-R', serif; writing-mode: horizontal-tb; }
            .page-break { display: none !important; }
            .print-meta-col { width: auto; border-left: 2px dashed #999; display: flex; flex-direction: column; align-items: flex-start; padding-left: 10px; margin-left: 5px; writing-mode: vertical-rl; flex-shrink: 0; padding-top: 15px; }
            .print-meta-box { border: 1px solid #333; padding: 15px 5px; font-size: 14px; margin: 0; text-align: center; border-radius: 4px; white-space: nowrap; }
            .print-name-box { font-size: 1.2rem; margin-top: auto; margin-right: 2rem; margin-left: 1.5rem; margin-bottom: 30px; display: flex; flex-direction: row; align-items: center; height: 120mm; }
            .name-space { flex: 1; }
            .print-bracket { display: flex; flex-direction: row; justify-content: space-between; align-items: center; }
            .bracket-space { flex: 1; }
            .print-answer-text { color: #e53e3e; font-weight: 600; font-family: 'Klee One', 'UD デジタル 教科書体 N-R', serif; display: flex; flex: 1; align-items: center; justify-content: center; text-align: center; }
            .print-problems-grid { flex: 1; display: flex; flex-direction: column; min-width: 0; width: 100%; }
            .print-problem-row { flex: 1; display: flex; flex-direction: row-reverse; border-bottom: 2px dashed #999; min-height: 0; height: 100%; }
            .print-problem-row:last-child { border-bottom: none; }
            .print-problem-col { flex: 1; flex-shrink: 1; writing-mode: vertical-rl; text-orientation: upright; display: flex; flex-direction: column; justify-content: flex-start; align-items: flex-start; padding: 10px 5px; }
            .print-problem-col.empty { visibility: hidden; }
            .print-prob-answer-line { display: flex; flex-direction: row; align-items: center; }
            .print-underline { border-right: 1.5px solid black; padding-right: 2px; margin-right: 2px; }
            .print-rows-1 .print-problem-col, .print-rows-2 .print-problem-col { padding: 10px 5px; }
            .print-rows-1 .print-prob-text-line, .print-rows-2 .print-prob-text-line { font-size: 1.2rem; line-height: 2; margin-top: 40px; }
            .print-rows-1 .print-prob-num, .print-rows-2 .print-prob-num { font-size: 1.1rem; margin-bottom: 5px; }
            .print-rows-1 .print-bracket, .print-rows-2 .print-bracket { font-size: 1.2rem; margin-bottom: 5px; height: 35mm; }
            .print-rows-1 .print-bracket.large, .print-rows-2 .print-bracket.large { height: 70mm; }
            .print-rows-1 .print-prob-answer-line, .print-rows-2 .print-prob-answer-line { margin-left: 15px; }
            .print-rows-3 .print-problem-col { padding: 8px 3px; }
            .print-rows-3 .print-prob-text-line { font-size: 1.0rem; line-height: 1.8; margin-top: 30px; }
            .print-rows-3 .print-prob-num { font-size: 1.0rem; margin-bottom: 4px; }
            .print-rows-3 .print-bracket { font-size: 1.0rem; margin-bottom: 4px; height: 24mm; }
            .print-rows-3 .print-bracket.large { height: 48mm; }
            .print-rows-3 .print-prob-answer-line { margin-left: 10px; }
            .print-rows-4 .print-problem-col, .print-rows-5 .print-problem-col { padding: 5px 2px; }
            .print-rows-4 .print-prob-text-line, .print-rows-5 .print-prob-text-line { font-size: 0.85rem; line-height: 1.4; margin-top: 15px; }
            .print-rows-4 .print-prob-num, .print-rows-5 .print-prob-num { font-size: 0.85rem; margin-bottom: 2px; }
            .print-rows-4 .print-bracket, .print-rows-5 .print-bracket { font-size: 0.85rem; margin-bottom: 2px; height: 15mm; }
            .print-rows-4 .print-bracket.large, .print-rows-5 .print-bracket.large { height: 30mm; }
            .print-rows-4 .print-prob-answer-line, .print-rows-5 .print-prob-answer-line { margin-left: 5px; }
        }
        .edit-controls { margin-bottom: 15px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
        .btn-red { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .btn-gray { background: #6b7280; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
  </style>
 </head>
 <body>
  <div id="topPage" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); z-index: 4000; display: flex; flex-direction: column; align-items: center; justify-content: center; writing-mode: vertical-rl; text-orientation: upright;">
      <h1 class="top-title" style="margin-right: 5%;">漢字学習ナビ</h1>
      <div class="top-menu">
          <button class="top-menu-btn btn-kanji-practice" onclick="goToKanjiPracticeMode()">
              <span>漢字練習</span>
              <span id="topKanjiPracticeScore" style="margin-top: 25px; font-size: 1.2rem; font-weight: bold; writing-mode: horizontal-tb;">0 pt</span>
          </button>
          <button class="top-menu-btn btn-flashcard" onclick="goToFlashcardMode()"><span>フラッシュカード</span></button>
          <button class="top-menu-btn btn-read" onclick="goToReadingMode()">
              <span>正しく読めるかな？</span>
              <span id="topReadScore" style="margin-top: 25px; font-size: 1.2rem; font-weight: bold; writing-mode: horizontal-tb;">0 pt</span>
          </button>
          <button class="top-menu-btn btn-write" onclick="goToPracticeMode()">
              <span>正しく書けるかな？</span>
              <span style="font-size: 0.9rem; font-weight: normal; margin-right: 15px; line-height: 1.4;">えんぴつとノートをよういしてね</span>
          </button>
          <button class="top-menu-btn btn-print" disabled style="opacity: 0.6; cursor: not-allowed;"><span>プリント印刷 🔒</span></button>
          <button id="topMinigameBtn" class="top-menu-btn btn-minigame" onclick="goToMinigameMenu()" disabled style="opacity: 0.6;">
              <span>ミニゲーム 🔒</span>
              <span id="minigameLockText" style="font-size:0.9rem;">ポイント不足</span>
          </button>
      </div>
  </div>

  <button id="backToTopBtnMain" class="mode-switch-btn" onclick="goToTopMode()" style="display: none; background: #718096;">トップへ戻る</button>

  <div class="container" id="kanjiPracticeContainer" style="display: none;">
      <div id="kanjiPracticeHeaderArea">
          <select id="kanjiPracticeSelector" onchange="onKanjiPracticeGradeChange()" style="background: white; border: 2px solid #cbd5e0; border-radius: 12px; padding: 8px 12px; font-size: 0.7rem; font-weight: bold; cursor: pointer; writing-mode: vertical-rl;">
              <option value="">読込中...</option>
          </select>
      </div>
      <div id="kanjiPracticeContentArea" class="kanji-practice-content"></div>
  </div>

  <div class="container" id="mainContainer" style="display: none;">
      <div id="headerArea">
          <select id="gradeSelector" onchange="onGradeChange()" style="background: white; border: 2px solid #cbd5e0; border-radius: 12px; padding: 8px 12px; font-size: 0.7rem; font-weight: bold; cursor: pointer; writing-mode: vertical-rl;"><option value="">学年...</option></select>
          <select id="unitSelector" onchange="onUnitChange()" style="background: white; border: 2px solid #cbd5e0; border-radius: 12px; padding: 8px 12px; font-size: 0.7rem; font-weight: bold; cursor: pointer; writing-mode: vertical-rl;"><option value="">単元...</option></select>
          <select id="rangeSelector" onchange="onRangeChange()" style="background: white; border: 2px solid #cbd5e0; border-radius: 12px; padding: 8px 12px; font-size: 0.7rem; font-weight: bold; cursor: pointer; writing-mode: vertical-rl;">
              <option value="up-to">まで</option>
              <option value="only" selected>だけ</option>
          </select>
      </div>
      <div style="color: #e53e3e; font-weight: bold; font-size: 1.5rem; margin-right: 15px; writing-mode: vertical-rl; flex-shrink: 0; white-space: nowrap;">ノートに正しい字を書けるかな？</div>
      <div id="cardsArea"></div>
      <div id="writeSentenceDisplay" class="sentence" style="margin-right: 30px; display: none;"></div>
  </div>

  <div class="container" id="readingContainer" style="display: none;">
      <div id="readHeaderArea">
          <select id="readGradeSelector" onchange="onReadGradeChange()" style="background: white; border: 2px solid #cbd5e0; border-radius: 12px; padding: 8px 12px; font-size: 0.7rem; font-weight: bold; cursor: pointer; writing-mode: vertical-rl;"><option value="">学年...</option></select>
          <select id="readUnitSelector" onchange="onReadUnitChange()" style="background: white; border: 2px solid #cbd5e0; border-radius: 12px; padding: 8px 12px; font-size: 0.7rem; font-weight: bold; cursor: pointer; writing-mode: vertical-rl;"><option value="">単元...</option></select>
          <select id="readRangeSelector" onchange="onReadRangeChange()" style="display: none;"><option value="only" selected>だけ</option></select>
      </div>
      <div style="display: flex; flex-direction: row; gap: 15px; margin-right: 20px;">
          <div id="readProgress" class="progress" style="margin: 0;">0 / 0</div>
          <div id="readScoreDisplay" style="margin: 0; color: #ed8936; font-size: 1.1rem; font-weight: bold; writing-mode: horizontal-tb;">0 pt</div>
      </div>
      <div id="readCardsArea"></div>
      <div class="controls" style="gap: 15px;">
          <button onclick="prevReadingProblem()" style="padding: 15px 8px; font-size: 1rem; font-weight: bold; background: #e2e8f0; color: #4a5568; border-radius: 12px; border: none; cursor: pointer; writing-mode: vertical-rl;">前へ</button>
          <button onclick="nextReadingProblem()" style="padding: 15px 8px; font-size: 1rem; font-weight: bold; background: #48bb78; color: white; border-radius: 12px; border: none; cursor: pointer; writing-mode: vertical-rl;">次へ</button>
      </div>
  </div>

  <div id="flashcardPage" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:#dcfce7; z-index:3000; flex-direction:column; align-items:center; justify-content:center; writing-mode:vertical-rl; text-orientation:upright;">
      <div style="position: absolute; top: 20px; left: 20px;">
          <button onclick="goToTopMode()" style="background: #718096; color: white; border: none; padding: 22px 15px; border-radius: 15px; font-size: 1.5rem; font-weight: bold; cursor: pointer; writing-mode: vertical-rl;">トップへ戻る</button>
      </div>
      <div style="position: absolute; top: 20px; right: 20px; display: flex; flex-direction: row; gap: 10px;">
          <select id="fcGradeSelector" onchange="onFcGradeChange()" style="background: white; border: 2px solid #cbd5e0; border-radius: 10px; padding: 10px 8px; font-size: 1rem; font-weight: bold; cursor: pointer; writing-mode: vertical-rl;"><option value="">学年...</option></select>
          <select id="fcUnitSelector" onchange="onFcUnitChange()" style="background: white; border: 2px solid #cbd5e0; border-radius: 10px; padding: 10px 8px; font-size: 1rem; font-weight: bold; cursor: pointer; writing-mode: vertical-rl;"><option value="">単元...</option></select>
          <select id="fcRangeSelector" onchange="onFcRangeChange()" style="background: white; border: 2px solid #cbd5e0; border-radius: 10px; padding: 10px 8px; font-size: 1rem; font-weight: bold; cursor: pointer; writing-mode: vertical-rl;"><option value="up-to">まで</option><option value="only" selected>だけ</option></select>
      </div>
      <div style="margin-right: 40px; margin-left: 20px;">
          <h1 style="display: inline-block; font-size: 2rem; font-weight: bold; color: #2d3748; margin: 0; vertical-align: middle;">フラッシュカード</h1>
          <button id="fcModeBtn" onclick="toggleFcMode()" style="display: inline-block; vertical-align: middle; margin-left: 20px; margin-top: 0; background: white; color: #e53e3e; border: 2px solid #e53e3e; border-radius: 10px; padding: 10px 8px; font-size: 1.2rem; font-weight: bold; cursor: pointer; writing-mode: vertical-rl;">読み</button>
      </div>
      <div id="fcProgress" style="font-size: 1.2rem; color: #4a5568; font-weight: bold; margin-right: 20px;">0 / 0</div>
      <div class="fc-card-container">
          <div id="fcCardInner" class="fc-card-inner">
              <div id="fcFrontText" style="font-size: 3rem; font-family: 'UD デジタル 教科書体 N-R', 'UD Digi Kyokasho N-R', 'Klee One', '教科書体', serif; width: 100%; display: flex; justify-content: center;"></div>
          </div>
      </div>
      <div style="color: #6b7280; font-size: 1rem; margin-right: 20px; margin-left: 20px;">「次へ」を押して答えを確認</div>
      <div style="display: flex; flex-direction: row; gap: 40px; margin-right: 20px; margin-left: 20px;">
          <button class="btn-blue" style="writing-mode: vertical-rl; padding: 20px 10px; font-size: 1.2rem;" onclick="prevFlashcard()">前へ</button>
          <button class="btn-blue" style="writing-mode: vertical-rl; padding: 20px 10px; font-size: 1.2rem; background: #48bb78;" onclick="nextFlashcard()">次へ</button>
      </div>
  </div>

  <div id="printPage">

        // === Utils ===
        window.getCircleNumber = function(num) {
            if (num >= 1 && num <= 20) return String.fromCharCode(0x245F + num);
            if (num >= 21 && num <= 35) return String.fromCharCode(0x3251 + num - 21);
            if (num >= 36 && num <= 50) return String.fromCharCode(0x32B1 + num - 36);
            return `(${num})`;
        }
        window.getHash = function(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) hash = ((hash << 5) - hash) + str.charCodeAt(i) | 0;
            return Math.abs(hash).toString(36);
        }

        // CSVデータを正確にパース（空セルやセル内改行に対応）する関数
        window.parseCSV = function(text) {
            const rows = [];
            let row = [];
            let val = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (c === '"') {
                    if (inQuotes && text[i+1] === '"') {
                        val += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (c === ',' && !inQuotes) {
                    row.push(val);
                    val = '';
                } else if ((c === '\n' || c === '\r') && !inQuotes) {
                    if (c === '\r' && text[i+1] === '\n') i++;
                    row.push(val);
                    rows.push(row);
                    row = [];
                    val = '';
                } else {
                    val += c;
                }
            }
            if (row.length > 0 || val !== '') {
                row.push(val);

        // テキストに手動ふりがなを付与する関数
        window.processFurigana = async function(text) {
            if (!text || text.trim() === '') return text;
            
            // 手動ルビの構文が含まれている場合はそれを優先して変換する
            if (text.match(/\{.+?\|.+?\}/) || text.match(/[一-龠々]+\([ぁ-んァ-ヶー]+\)/) || text.match(/[一-龠々]+（[ぁ-んァ-ヶー]+）/)) {
                let htmlText = text.replace(/\{(.+?)\|(.+?)\}/g, '<ruby>$1<rt>$2</rt></ruby>');
                htmlText = htmlText.replace(/([一-龠々]+)\(([ぁ-んァ-ヶー]+)\)/g, '<ruby>$1<rt>$2</rt></ruby>');
                htmlText = htmlText.replace(/([一-龠々]+)（([ぁ-んァ-ヶー]+)）/g, '<ruby>$1<rt>$2</rt></ruby>');
                return htmlText;
            }

            return text;
        };

        window.onKanjiPracticeGradeChange = async () => {
            // データが読み込まれていなければ、ここで読み込む
            if (!kanjiPracticeDataLoaded) {
                const currentVal = document.getElementById('kanjiPracticeSelector').value;

            }

            const grade = document.getElementById('kanjiPracticeSelector').value;
            const content = document.getElementById('kanjiPracticeContentArea');
            content.innerHTML = '';
            if (!grade) return;
            
            const unitsMap = new Map();
            const unitsOrder = [];
            
            // 漢字詳細用シート (kanjiPracticeRawData) から抽出する
            kanjiPracticeRawData.slice(1).forEach(r => {
                const rowGrade = r[0]?.trim();
                if (rowGrade !== grade) return;
                
                // T列 (インデックス19) から単元名を取得
                const unit = (r.length > 19 ? r[19]?.trim() : '') || '未分類';
                
                if (!unitsMap.has(unit)) { 
                    unitsMap.set(unit, new Set()); 
                    unitsOrder.push(unit); 
                }
                
                // X列 (インデックス23) から漢字を取得
                let kanjiData = r.length > 23 ? r[23]?.trim() : '';

                // 万が一列がずれている場合のための保険
                if (!kanjiData || kanjiData.trim() === '') {
                    for (let i = 20; i < r.length; i++) {
                        const cell = r[i] || '';
                        if (cell.match(/[\u4E00-\u9FFF々]/) && !cell.includes('{')) {
                            kanjiData += cell;
                        }
                    }
                }

                // 見つかった漢字をボタン用リストに追加
                if (kanjiData) {
                    for (const char of kanjiData) {
                        if (char.match(/[\u4E00-\u9FFF々]/)) {
                            unitsMap.get(unit).add(char);
                        }
                    }
                }
            });

        window.playKanjiAnimation = async function(kanji, container) {
            const animId = ++currentAnimId;
            const code = kanji.charCodeAt(0).toString(16).padStart(5, '0');
            const url = `https://cdn.jsdelivr.net/gh/KanjiVG/kanjivg@master/kanji/${code}.svg`;
            try {
                const res = await fetch(url);
                let svgText = await res.text();
                const svgMatch = svgText.match(/<svg[^>]*>[\s\S]*<\/svg>/i);
                if (svgMatch) svgText = svgMatch[0];
                
                if (currentAnimId !== animId) return;

                for (let loop = 0; loop < 3; loop++) {
                    if (currentAnimId !== animId) break;
                    
                    // アニメーション開始前にSVGを再生成して完全にリセットする
                    container.innerHTML = svgText;
                    const svg = container.querySelector('svg');
                    if (!svg) return;
                    svg.querySelectorAll('text').forEach(t => t.remove());
                    svg.style.cssText = 'width:100%;height:100%;display:block;';
                    const paths = Array.from(svg.querySelectorAll('path'));

                    // すべてのパス（線）を非表示にリセット
                    paths.forEach(p => {
                        const len = p.getTotalLength();
                        p.style.cssText = `fill:none;stroke:#3182ce;stroke-width:4;stroke-linecap:round;stroke-dasharray:${len};stroke-dashoffset:${len}`;
                    });

                    // 1画ずつアニメーション
                    for (const p of paths) {
                        if (currentAnimId !== animId) break;
                        const len = p.getTotalLength();
                        const anim = p.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: 600, fill: 'forwards' });
                        // 特定のブラウザでのフリーズを防ぐためPromiseでラップ
                        await new Promise(resolve => {
                            anim.onfinish = resolve;
                            anim.oncancel = resolve;
                        });
                        p.style.strokeDashoffset = '0'; 
                    }
                    if (loop < 2 && currentAnimId === animId) await new Promise(r => setTimeout(r, 1000));
                }
            } catch(e) { 
                if (currentAnimId === animId) {
                    container.innerHTML = `<span style="font-size:4rem;">${kanji}</span>`; 
                }
            }
        }

        window.playAssembleAnimation = async function(kanji, container) {
            const animId = ++currentAnimId;
            const code = kanji.charCodeAt(0).toString(16).padStart(5, '0');
            const url = `https://cdn.jsdelivr.net/gh/KanjiVG/kanjivg@master/kanji/${code}.svg`;
            try {
                const res = await fetch(url);
                let svgText = await res.text();
                const svgMatch = svgText.match(/<svg[^>]*>[\s\S]*<\/svg>/i);
                if (svgMatch) svgText = svgMatch[0];

                if (currentAnimId !== animId) return;
                
                container.innerHTML = svgText;
                const svg = container.querySelector('svg');
                if (!svg) return;
                svg.querySelectorAll('text').forEach(t => t.remove());
                svg.style.cssText = 'width:100%;height:100%;display:block;overflow:visible;';
                const strokePathsGroup = svg.querySelector('g[id^="kvg:StrokePaths_"]');
                const parts = [];
                const extract = (node) => {
                    const children = Array.from(node.children);
                    if (!children.some(c => c.tagName.toLowerCase() === 'g')) {
                        if (node === strokePathsGroup) children.forEach(c => parts.push(c));
                        else parts.push(node);
                    } else {
                        children.forEach(c => c.tagName.toLowerCase() === 'g' ? extract(c) : parts.push(c));
                    }
                };
                if (strokePathsGroup) extract(strokePathsGroup);
                
                const colors = ['#e53e3e', '#3182ce', '#38a169', '#dd6b20', '#805ad5', '#d53f8c'];
                parts.forEach((p, i) => {
                    const color = colors[i % colors.length];
                    const pths = p.tagName.toLowerCase() === 'path' ? [p] : Array.from(p.querySelectorAll('path'));
                    pths.forEach(pth => {
                        pth.style.cssText = `fill:none;stroke:${color};stroke-width:4;stroke-linecap:round;`;
                    });
                    p.style.opacity = '0';
                });
                for (const p of parts) {
                    if (currentAnimId !== animId) break;
                    const angle = Math.random() * Math.PI * 2;
                    const anim = p.animate([
                        { transform: `translate(${Math.cos(angle)*150}px, ${Math.sin(angle)*150}px) scale(0.2)`, opacity: 0 },
                        { transform: 'translate(0,0) scale(1)', opacity: 1 }
                    ], { duration: 800, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)', fill: 'forwards' });
                    
                    await new Promise(resolve => {
                        anim.onfinish = resolve;
                        anim.oncancel = resolve;
                    });
                    p.style.opacity = '1';
                    await new Promise(r => setTimeout(r, 200));
                }
            } catch(e) { console.error(e); }
        }

        // 練習用キャンバスの処理
        let kdIsDrawing = { 1: false, 2: false };
        let kdHasDrawn = { 1: false, 2: false };

        window.initKdPracticeCanvas = function(id) {
            const canvas = document.getElementById('kdPracticeCanvas' + id);
            if (!canvas) return;
            const newCanvas = canvas.cloneNode(true);
            canvas.parentNode.replaceChild(newCanvas, canvas);
            
            window.clearKdPracticeCanvas(id);

            const ctx = newCanvas.getContext('2d');
            const start = (e) => { kdIsDrawing[id] = true; ctx.beginPath(); const rect = newCanvas.getBoundingClientRect(); ctx.moveTo((e.touches?e.touches[0].clientX:e.clientX)-rect.left, (e.touches?e.touches[0].clientY:e.clientY)-rect.top); e.preventDefault(); };
            const draw = (e) => { if(!kdIsDrawing[id]) return; kdHasDrawn[id] = true; const rect = newCanvas.getBoundingClientRect(); ctx.lineTo((e.touches?e.touches[0].clientX:e.clientX)-rect.left, (e.touches?e.touches[0].clientY:e.clientY)-rect.top); ctx.strokeStyle='black'; ctx.lineWidth=8; ctx.lineCap='round'; ctx.stroke(); e.preventDefault(); };
            const stop = () => { kdIsDrawing[id] = false; };
            
            newCanvas.addEventListener('mousedown', start); 
            newCanvas.addEventListener('mousemove', draw); 
            newCanvas.addEventListener('mouseup', stop); 
            newCanvas.addEventListener('mouseout', stop);
            newCanvas.addEventListener('touchstart', start, {passive:false});

        window.clearKdPracticeCanvas = function(id) {

            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // 補助線の描画
            ctx.beginPath(); 
            ctx.strokeStyle = '#e2e8f0'; 
            ctx.setLineDash([4,4]);
            ctx.lineWidth = 2;
            ctx.moveTo(canvas.width/2, 0); ctx.lineTo(canvas.width/2, canvas.height);
            ctx.moveTo(0, canvas.height/2); ctx.lineTo(canvas.width, canvas.height/2);

        // ピンポン音を鳴らす関数
        window.playCorrectSound = function() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const playTone = (freq, startTime, duration) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + startTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime + startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + startTime + duration);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + startTime);
                    osc.stop(ctx.currentTime + startTime + duration);
                };
                playTone(987.77, 0, 0.2);    // 高い音
                playTone(783.99, 0.15, 0.4); // 少し低い音
            } catch(e) { console.warn("音が再生できませんでした", e); }
        };

        // エンターキーを押したとき（間違えた場合）の処理
        window.handleKanjiDetailKeydown = function(event, input, answer) {
            if (event.key === 'Enter') {
                event.preventDefault();
                const userVal = input.value.trim().replace(/[\u30a1-\u30f6]/g, m => String.fromCharCode(m.charCodeAt(0)-0x60));
                if (userVal === answer) {
                    window.checkKanjiDetailReading(input, answer);
                } else if (userVal !== '') {
                    // まちがえた場合は正解を赤色で表示し、全消しを要求するフラグを立てる
                    input.value = answer;
                    input.style.color = '#e53e3e';
                    input.dataset.mustClear = "true";
                } else {
                    window.nextKanjiDetailInput(input);
                }
            }
        };

        // 詳細画面での入力の正解判定
        window.checkKanjiDetailReading = function(input, answer) {
            // 文字が変更（消去・入力）されたら色を元に戻す
            input.style.color = '';
            
            // 一度全部消さないと正解にしないための処理
            if (input.dataset.mustClear === "true") {
                // 1文字でも変更（消去）されたら、自動的に全部消去する
                if (input.value !== answer && input.value !== '') {
                    input.value = '';
                }

                if (input.value === '') {
                    // 入力欄が完全に空になったらフラグを解除して、再度正解できるようにする
                    input.dataset.mustClear = "false";
                }
                // フラグが解除されるまでは正解判定を行わない
                return;
            }
            
            // ひらがな・カタカナをひらがなに統一して判定
            const userVal = input.value.trim().replace(/[\u30a1-\u30f6]/g, m => String.fromCharCode(m.charCodeAt(0)-0x60));
            if (userVal === answer) {
                // 正解音を鳴らす
                window.playCorrectSound();
                
                input.classList.add('correct');
                input.disabled = true;
                
                // 〇マークを表示する
                let circle = input.parentElement.querySelector('.correct-mark');
                if (!circle) {
                    circle = document.createElement('span');
                    circle.className = 'correct-mark';
                    circle.textContent = '〇';
                    circle.style.cssText = 'position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #e53e3e; font-size: 2.5rem; font-weight: bold; pointer-events: none; opacity: 0.8; z-index: 10; font-family: sans-serif;';
                    input.parentElement.appendChild(circle);
                }

                const key = input.getAttribute('data-key');
                if (key && !completedKanjiReadings.has(key)) {
                    // 初回正解で2ポイント
                    kanjiPracticeScore += 2;
                    completedKanjiReadings.add(key);
                } else {
                    // 2回目以降で1ポイント
                    kanjiPracticeScore += 1;
                }
                
                window.updateScoreDisplay();
                
                setTimeout(() => window.nextKanjiDetailInput(input), 300);
            }
        };

        window.createWordAnswerBox = function(word, reading) {
            const block = document.createElement('div');
            // 右から左へ並べるため column
            block.style.cssText = 'display:flex; flex-direction:column; align-items:center; gap:20px; writing-mode: vertical-rl; margin-bottom: 10px;';
            const size = 125; // 答えマスのサイズを250pxから半分の125pxに変更
            
            const ansGroup = document.createElement('div');
            ansGroup.style.cssText = 'display: flex; flex-direction: column; align-items: center; gap: 10px; writing-mode: horizontal-tb;';

            const ansDisplayWrapper = document.createElement('div');
            // 複数文字がある場合は上下に並べる
            ansDisplayWrapper.style.cssText = 'display: flex; flex-direction: column; gap: 10px;';
            
            const charDisplays = [];
            const chars = Array.from(word);
            for (const char of chars) {
                const ansDisplay = document.createElement('div');
                ansDisplay.style.cssText = `width:${size}px; height:${size}px; border:2px solid #cbd5e0; background:#f7fafc; border-radius: 8px; display: flex; align-items: center; justify-content: center; position: relative; writing-mode: horizontal-tb;`;
                ansDisplayWrapper.appendChild(ansDisplay);
                charDisplays.push({ char, el: ansDisplay });
            }

            const ansBtn = document.createElement('button');
            ansBtn.textContent = '答え';
            // ボタンの大きさを1/4にし、答えマスの下に配置
            ansBtn.style.cssText = 'width: 25%; min-width: 60px; background:white; border:2px solid #cbd5e0; border-radius:6px; padding:5px 0; font-weight:bold; cursor:pointer; font-size: 0.9rem; color: #4a5568; box-sizing: border-box; text-align: center; writing-mode: horizontal-tb;';

            let currentLocalAnimId = 0;
            ansBtn.onclick = async () => {
                const animId = ++currentLocalAnimId;
                
                // 各文字のSVGデータを取得
                const svgDataArray = [];
                for (const item of charDisplays) {
                    const code = item.char.charCodeAt(0).toString(16).padStart(5, '0');
                    const url = `https://cdn.jsdelivr.net/gh/KanjiVG/kanjivg@master/kanji/${code}.svg`;
                    let svgText = '';
                    try {
                        const res = await fetch(url);
                        svgText = await res.text();
                        const svgMatch = svgText.match(/<svg[^>]*>[\s\S]*<\/svg>/i);
                        if (svgMatch) svgText = svgMatch[0];
                    } catch(e) {
                        svgText = null;
                    }
                    svgDataArray.push(svgText);
                }
                
                if (currentLocalAnimId !== animId) return;

                charDisplays.forEach(item => {
                    item.el.style.background = '#ebf8ff';
                    item.el.style.borderColor = '#63b3ed';
                });
                
                for (let loop = 0; loop < 3; loop++) {
                    if (currentLocalAnimId !== animId) break;
                    
                    // 全ての文字の書き順アニメーションを同時に開始する
                    const animPromises = charDisplays.map(async (item, i) => {
                        const svgText = svgDataArray[i];
                        if (svgText) {
                            item.el.innerHTML = svgText;
                            const svg = item.el.querySelector('svg');
                            if (svg) {
                                svg.querySelectorAll('text').forEach(t=>t.remove());
                                svg.style.cssText = 'width:90%;height:90%;display:block;';
                                const paths = Array.from(svg.querySelectorAll('path'));
                                paths.forEach(p => {
                                    const len = p.getTotalLength();
                                    p.style.cssText = `fill:none;stroke:#3182ce;stroke-width:4;stroke-linecap:round;stroke-dasharray:${len};stroke-dashoffset:${len}`;
                                });

                                for (const p of paths) {
                                    if (currentLocalAnimId !== animId) break;
                                    const len = p.getTotalLength();
                                    const anim = p.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: 600, fill: 'forwards' });
                                    
                                    // アニメーション終了の確実な待機
                                    await new Promise(resolve => {
                                        anim.onfinish = resolve;
                                        anim.oncancel = resolve;
                                    });
                                    p.style.strokeDashoffset = '0'; 
                                }
                            }
                        } else {
                            item.el.innerHTML = `<span style="font-size: ${size * 0.6}px; color: #3182ce; font-family: 'Klee One', serif;">${item.char}</span>`;
                        }
                    });
                    
                    // 並列実行された全てのアニメーションを待機
                    await Promise.all(animPromises);

                    if (loop < 2 && currentLocalAnimId === animId) await new Promise(r => setTimeout(r, 1000));
                }
            };
            
            ansGroup.appendChild(ansDisplayWrapper);
            ansGroup.appendChild(ansBtn);
            
            block.appendChild(ansGroup);
            
            return block;
        }

        window.goToNextUnitRead = () => {

            const units = [...new Set(allProblems.filter(p => p.grade === grade).map(p => p.unit))];
            const currentIndex = units.indexOf(currentUnit);
            if (currentIndex > -1 && currentIndex < units.length - 1) {
                document.getElementById('readUnitSelector').value = units[currentIndex + 1];
                window.onReadUnitChange();
            } else {
                currentReadIndex = 0;
                window.renderReadCards();
            }
        };

        // =====================
        // フラッシュカード
        // =====================
        window.goToFlashcardMode = () => {
            window.goToTopMode();
            document.getElementById('topPage').style.display = 'none';
            document.getElementById('flashcardPage').style.display = 'flex';
            document.getElementById('backToTopBtnMain').style.display = 'block';
            
            const grade = document.getElementById('gradeSelector').value || document.getElementById('readGradeSelector').value;
            document.getElementById('fcGradeSelector').value = grade;
            window.onFcGradeChange();
            document.getElementById('fcUnitSelector').value = document.getElementById('unitSelector').value || document.getElementById('readUnitSelector').value;
            window.filterFlashcards();
        };

        window.onFcGradeChange = () => {
            const grade = document.getElementById('fcGradeSelector').value;
            const units = [...new Set(allProblems.filter(p => p.grade === grade).map(p => p.unit))];
            const sel = document.getElementById('fcUnitSelector');
            sel.innerHTML = '<option value="">単元...</option><option value="all">すべて</option>';
            units.forEach(u => sel.innerHTML += `<option value="${u}">${u}</option>`);
        };

        window.onFcUnitChange = () => { window.filterFlashcards(); };
        window.onFcRangeChange = () => { window.filterFlashcards(); };

        window.filterFlashcards = () => {
            const grade = document.getElementById('fcGradeSelector').value;
            const unit = document.getElementById('fcUnitSelector').value;
            if (!grade || !unit) { fcProbs = []; return; }
            fcProbs = allProblems.filter(p => p.grade === grade && (unit === 'all' || p.unit === unit));
            fcIdx = 0; fcState = 'question'; 
            window.showFc();
        };

        window.toggleFcMode = () => {
            fcMode = fcMode === 'read' ? 'write' : 'read';
            document.getElementById('fcModeBtn').textContent = fcMode === 'read' ? '読み' : '書き';
            window.showFc();
        };

        window.showFc = () => {
            if(fcProbs.length === 0) { document.getElementById('fcFrontText').textContent = "問題がありません"; return; }
            const p = fcProbs[fcIdx];
            document.getElementById('fcProgress').textContent = `${fcIdx + 1} / ${fcProbs.length}`;
            
            let questionHtml = "";
            let answers = [];

            p.sentence.split(/(\{.+?\|.+?\})/).forEach(part => {
                if (part.startsWith('{')) {
                    const [k, r] = part.slice(1, -1).split('|');
                    if (fcMode === 'read') {
                        questionHtml += `<span style="color:#e53e3e;text-decoration:underline;text-decoration-thickness:2px;">${k}</span>`;
                        answers.push(r);
                    } else {
                        questionHtml += `<span style="color:#e53e3e;text-decoration:underline;text-decoration-thickness:2px;">${r}</span>`;
                        answers.push(k);
                    }
                } else {
                    questionHtml += part;
                }
            });

            const fontStyle = "font-family: 'UD デジタル 教科書体 N-R', 'UD Digi Kyokasho N-R', 'Klee One', '教科書体', serif;";

            if (fcState === 'question') {
                document.getElementById('fcFrontText').innerHTML = `
                    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; ${fontStyle}">
                        <div style="white-space: nowrap; font-size: 3rem; color: #4a5568;">${questionHtml}</div>
                    </div>
                `;
            } else {
                const answerHtml = answers.join('　');
                document.getElementById('fcFrontText').innerHTML = `
                    <div style="display: flex; flex-direction: column; gap: 60px; align-items: center; justify-content: center; ${fontStyle}">
                        <div style="font-size: 3rem; color: #e53e3e; font-weight: bold; white-space: nowrap;">${answerHtml}</div>
                        <div style="font-size: 3rem; color: #4a5568; white-space: nowrap;">${questionHtml}</div>
                    </div>
                `;
            }
        };

        window.nextFlashcard = () => {
            if(fcState === 'question') { 
                fcState = 'answer'; 
                window.showFc(); 
            } else { 
                fcIdx++;
                if (fcIdx >= fcProbs.length) {
                    window.goToNextUnitFc();
                } else {
                    fcState = 'question'; 
                    window.showFc(); 
                }
            }
        };
        window.prevFlashcard = () => {
            if(fcState === 'answer') { fcState = 'question'; window.showFc(); }
            else { fcIdx = (fcIdx - 1 + fcProbs.length) % fcProbs.length; fcState = 'question'; window.showFc(); }
        };
        window.goToNextUnitFc = () => {
            const grade = document.getElementById('fcGradeSelector').value;
            const currentUnit = document.getElementById('fcUnitSelector').value;
            if (currentUnit === 'all') {
                fcIdx = 0;
                fcState = 'question';
                window.showFc();
                return;
            }
            const units = [...new Set(allProblems.filter(p => p.grade === grade).map(p => p.unit))];
            const currentIndex = units.indexOf(currentUnit);
            if (currentIndex > -1 && currentIndex < units.length - 1) {
                document.getElementById('fcUnitSelector').value = units[currentIndex + 1];
                window.filterFlashcards();
            } else {
                fcIdx = 0;
                fcState = 'question';
                window.showFc();
            }
        };

        // =====================
        // プリントアウト
        // =====================
        window.goToPrintMode = () => {
            window.goToTopMode();
            document.getElementById('topPage').style.display = 'none';
            document.getElementById('printPage').style.display = 'flex';
            
            document.getElementById('printGradeSelector').value = document.getElementById('gradeSelector').value || document.getElementById('readGradeSelector').value || document.getElementById('fcGradeSelector').value;
            window.onPrintGradeChange();
        };
        
        window.onPrintGradeChange = () => {
            const grade = document.getElementById('printGradeSelector').value;
            const units = [...new Set(allProblems.filter(p => p.grade === grade).map(p => p.unit))];
            const sel = document.getElementById('printUnitSelector');
            sel.innerHTML = '<option value="">単元...</option><option value="all">すべて</option>';
            units.forEach(u => sel.innerHTML += `<option value="${u}">${u}</option>`);
            window.renderPrintPreview();
        };

        window.onPrintUnitChange = () => { window.renderPrintPreview(); };
        window.onPrintRangeChange = () => { window.renderPrintPreview(); };

        window.renderPrintPreview = () => {
            const container = document.getElementById('printAreaWrapper');
            container.innerHTML = '';
            const grade = document.getElementById('printGradeSelector').value;
            const unit = document.getElementById('printUnitSelector').value;
            if (!grade || !unit) { container.innerHTML = '<div style="padding:50px;">学年と単元を選択してください</div>'; return; }

            let filtered = allProblems.filter(p => p.grade === grade && (unit === 'all' || p.unit === unit));
            if(document.getElementById('printRangeSelector').value === 'up-to') filtered = filtered.sort(() => Math.random() - 0.5).slice(0, 50);

            if (filtered.length === 0) { container.innerHTML = '<div style="padding:50px;">問題がありません</div>'; return; }

            const chunks = [];
            for (let i = 0; i < filtered.length; i += 20) chunks.push(filtered.slice(i, i + 20));

            chunks.forEach((probs, pIdx) => {
                const pageInfo = chunks.length > 1 ? ` (${pIdx + 1}/${chunks.length})` : '';
                const title = `${grade} ${unit==='all'?'すべて':unit} ${pageInfo}`;
                
                const qPage = window.createPrintPageDOM(title, probs, pIdx * 20, false);
                container.appendChild(qPage);
                container.innerHTML += '<div class="page-break"></div>';
                
                const aPage = window.createPrintPageDOM(title + " 【解答】", probs, pIdx * 20, true);
                container.appendChild(aPage);
                if(pIdx < chunks.length - 1) container.innerHTML += '<div class="page-break"></div>';
            });
        };

        window.createPrintPageDOM = function(title, problems, startIdx, showAns) {
            const wrap = document.createElement('div');
            wrap.className = 'page-wrapper';
            const page = document.createElement('div');
            page.className = 'print-area-page';
            
            let html = `
                <div class="print-meta-col">
                    <div class="print-meta-box">${title}</div>
                    <div class="print-name-box"><span>名前（</span><span class="name-space"></span><span>）</span></div>
                </div>
                <div class="print-problems-grid print-rows-${Math.ceil(problems.length/10)}">
            `;
            
            for (let i = 0; i < problems.length; i += 10) {
                html += `<div class="print-problem-row">`;
                problems.slice(i, i+10).forEach((prob, idx) => {
                    const circleNum = window.getCircleNumber(startIdx + i + idx + 1);
                    let probText = '', ansHtml = '';
                    let ansList = [];
                    prob.sentence.split(/(\{.+?\|.+?\})/).forEach(part => {
                        if (part.startsWith('{')) {
                            const [k, r] = part.slice(1, -1).split('|');
                            probText += `<span class="print-underline">${r}</span>`;
                            ansList.push(k);
                        } else probText += `<span>${part}</span>`;
                    });
                    
                    ansList.forEach(ans => {
                        ansHtml += `<div class="print-bracket ${ansList.length===1?'large':''}"><span>（</span><span class="print-answer-text">${showAns?ans:''}</span><span>）</span></div>`;
                    });
                    
                    html += `<div class="print-problem-col"><div class="print-prob-answer-line"><div class="print-prob-num">${circleNum}</div>${ansHtml}</div><div class="print-prob-text-line">${probText}</div></div>`;
                });
                for(let j = problems.slice(i, i+10).length; j < 10; j++) html += `<div class="print-problem-col empty"></div>`;
                html += `</div>`;
            }
            page.innerHTML = html + `</div>`;
            wrap.appendChild(page);
            return wrap;
        }

        window.triggerPrint = () => { window.print(); };
        window.goToTopFromPrint = () => window.goToTopMode();

        // =====================
        // ミニゲーム
        // =====================
        window.goToMinigameMenu = () => {
            const plays = Math.floor((readScore + writeScore + kanjiPracticeScore) / 100) * 3 - minigamePlayCount;
            if (plays <= 0) { alert("ポイントが足りません！"); return; }
            document.getElementById('minigameRemainingPlays').textContent = `あと ${plays} 回あそべるよ！`;
            window.goToTopMode();
            document.getElementById('topPage').style.display = 'none';
            document.getElementById('minigameMenuPage').style.display = 'flex';
        };

        window.startMinigame = (type) => {
            if (Math.floor((readScore + writeScore + kanjiPracticeScore) / 100) * 3 - minigamePlayCount <= 0) { alert("ポイント不足です！"); return; }
            minigamePlayCount++;
            window.updateScoreDisplay(); 

            currentMgType = type;
            document.getElementById('minigameMenuPage').style.display = 'none';
            document.getElementById('minigamePlayPage').style.display = 'flex';
            document.getElementById('mgEndOverlay').style.display = 'none';
            document.getElementById('mgResultOverlay').style.display = 'none';
            
            if (type === 'bushu') currentMgData = [...mgBushuData].sort(() => Math.random() - 0.5).slice(0, 10);
            else if (type === 'naritachi') currentMgData = [...mgNaritachiData].sort(() => Math.random() - 0.5).slice(0, 10);
            else if (type === 'keisan') currentMgData = [...mgKeisanData].sort(() => Math.random() - 0.5).slice(0, 10);
            
            currentMgIndex = 0; currentMgScore = 0; mgStartTime = Date.now();
            if (mgTimerInterval) clearInterval(mgTimerInterval);
            document.getElementById('mgTimer').textContent = "00:00";
            mgTimerInterval = setInterval(() => {
                const diff = Math.floor((Date.now() - mgStartTime) / 1000);
                document.getElementById('mgTimer').textContent = `${Math.floor(diff/60).toString().padStart(2,'0')}:${(diff%60).toString().padStart(2,'0')}`;
            }, 1000);
            window.loadMgQuestion();
        };

        window.loadMgQuestion = () => {
            if (currentMgIndex >= currentMgData.length) { window.endMinigame(); return; }
            const prob = currentMgData[currentMgIndex];
            document.getElementById('mgScore').textContent = `${currentMgIndex + 1} / ${currentMgData.length} 問`;
            document.getElementById('mgQuestionText').innerHTML = prob.q; 
            const choicesContainer = document.getElementById('mgChoices');
            choicesContainer.innerHTML = '';
            [...prob.choices].sort(() => Math.random() - 0.5).forEach(choice => {
                const btn = document.createElement('button');
                btn.textContent = choice;
                btn.style.cssText = 'padding:15px 30px; font-size:1.8rem; border-radius:15px; border:2px solid #cbd5e0; background:white; color:#4a5568; cursor:pointer; font-weight:bold; min-width:200px; transition:all 0.2s;';
                btn.onmouseover = () => { btn.style.background = '#edf2f7'; btn.style.transform = 'scale(1.05)'; };
                btn.onmouseout = () => { btn.style.background = 'white'; btn.style.transform = 'scale(1)'; };
                btn.onclick = () => window.handleMgAnswer(choice === prob.a, btn);
                choicesContainer.appendChild(btn);
            });
        };

        window.handleMgAnswer = (isCorrect, btn) => {
            if (isCorrect) { btn.style.background = '#c6f6d5'; btn.style.borderColor = '#48bb78'; btn.style.color = '#2f855a'; currentMgScore++; }
            else { btn.style.background = '#fed7d7'; btn.style.borderColor = '#f56565'; btn.style.color = '#c53030'; }
            
            const overlay = document.getElementById('mgResultOverlay');
            overlay.style.display = 'flex';
            document.getElementById('mgResultMark').textContent = isCorrect ? '◯' : '✖';
            document.getElementById('mgResultMark').style.color = isCorrect ? '#48bb78' : '#f56565';
            document.getElementById('mgResultText').textContent = isCorrect ? 'せいかい！' : `ざんねん... せいかいは「${currentMgData[currentMgIndex].a}」`;
            
            setTimeout(() => { overlay.style.display = 'none'; currentMgIndex++; window.loadMgQuestion(); }, 1500);
        };

        window.endMinigame = () => {
            if (mgTimerInterval) clearInterval(mgTimerInterval);
            const diffInSec = Math.floor((Date.now() - mgStartTime) / 1000);
            window.checkAndSaveMgRecord(currentMgType, currentMgScore, currentMgData.length, diffInSec);
            
            document.getElementById('mgEndOverlay').style.display = 'flex';
            document.getElementById('mgFinalScore').innerHTML = `${currentMgData.length}問中 ${currentMgScore}問 正解！<br><span style="font-size:2rem;color:#718096;">タイム：${Math.floor(diffInSec/60)>0?Math.floor(diffInSec/60)+'分':''}${diffInSec%60}秒</span>`;
            
            const plays = Math.floor((readScore + writeScore + kanjiPracticeScore) / 100) * 3 - minigamePlayCount;
            const btnContainer = document.getElementById('mgEndButtons');
            if (plays > 0) {
                btnContainer.innerHTML = `<div style="display:flex;gap:20px;"><button class="btn-blue" onclick="goToMinigameMenu()" style="font-size:1.8rem;background:#48bb78;">別のゲーム</button><button class="btn-blue" onclick="startMinigame('${currentMgType}')" style="font-size:1.8rem;">もう１回</button></div>`;
            } else {
                btnContainer.innerHTML = `<div style="font-size:1.5rem;color:#e53e3e;font-weight:bold;margin-bottom:20px;">あそべる回数がなくなりました。</div><button class="btn-blue" onclick="goToTopMode()" style="font-size:1.8rem;background:#718096;">トップへ</button>`;
            }
        };

        // =====================
        // 編集・AI機能
        // =====================
        window.showEditDialog = () => { document.getElementById('editDialog').style.display = 'flex'; document.getElementById('passwordSection').style.display = 'block'; document.getElementById('editSection').style.display = 'none'; document.getElementById('passwordInput').value = ''; };
        window.closeEditDialog = () => { document.getElementById('editDialog').style.display = 'none'; };
        window.checkPassword = () => {
            if (document.getElementById('passwordInput').value === correctPassword) {
                document.getElementById('passwordSection').style.display = 'none';
                document.getElementById('editSection').style.display = 'flex';
                window.loadProblemEditor();
            } else alert('パスワードが間違っています。');
        };

        window.loadProblemEditor = () => {
            const table = document.getElementById('spreadsheetTable');
            table.innerHTML = `<tr><th style="width:40px;background:#e5e7eb;">✓</th><th style="width:50px;background:#e5e7eb;">No.</th><th style="width:120px;background:#e5e7eb;">学年</th><th style="width:120px;background:#e5e7eb;">単元名</th><th style="background:#e5e7eb;">問題文</th></tr>`;
            for (let i = 0; i < Math.max(allProblems.length + 5, 15); i++) {
                const prob = allProblems[i] || { grade: '', unit: '', sentence: '' };
                const bg = i % 2 === 0 ? '#fff' : '#f9fafb';
                table.innerHTML += `<tr style="background:${bg};"><td style="text-align:center;border:1px solid #d1d5db;"><input type="checkbox" class="row-selector" data-row="${i}"></td><td style="text-align:center;border:1px solid #d1d5db;">${i+1}</td><td style="border:1px solid #d1d5db;"><input type="text" class="cell-input" data-row="${i}" data-col="grade" value="${prob.grade}" style="width:100%;border:none;outline:none;background:transparent;" onpaste="window.handlePaste(event)"></td><td style="border:1px solid #d1d5db;"><input type="text" class="cell-input" data-row="${i}" data-col="unit" value="${prob.unit}" style="width:100%;border:none;outline:none;background:transparent;" onpaste="window.handlePaste(event)"></td><td style="border:1px solid #d1d5db;"><input type="text" class="cell-input" data-row="${i}" data-col="sentence" value="${prob.sentence}" style="width:100%;border:none;outline:none;background:transparent;" onpaste="window.handlePaste(event)"></td></tr>`;
            }
        };

        document.addEventListener('keydown', (e) => {
            const fcPage = document.getElementById('flashcardPage');
            if (fcPage && fcPage.style.display === 'flex') {
                if (e.key === 'Enter' || e.key === 'ArrowDown') {
                    e.preventDefault();
                    window.nextFlashcard();
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    window.prevFlashcard();
                }
            }
            if (e.target && e.target.classList.contains('cell-input')) {
                const input = e.target;
                const row = parseInt(input.dataset.row);
                const col = input.dataset.col; 
                if (e.key === 'ArrowDown' || e.key === 'Enter') {
                    e.preventDefault();
                    const nextRow = document.querySelector(`.cell-input[data-row="${row+1}"][data-col="${col}"]`);
                    if (nextRow) nextRow.focus();
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    const prevRow = document.querySelector(`.cell-input[data-row="${row-1}"][data-col="${col}"]`);
                    if (prevRow) prevRow.focus();
                }
            }
        });

        window.handlePaste = (e) => {
            e.preventDefault();
            const rows = (e.clipboardData || window.clipboardData).getData('text').split(/\r\n|\n|\r/).filter(r => r.trim() !== '');
            let currentRow = parseInt(e.target.dataset.row);
            const startCol = e.target.dataset.col; 
            rows.forEach((rowData, rIdx) => {
                const cols = rowData.split('\t');
                if (cols.length >= 3 && startCol === 'grade') {
                    window.setVal(currentRow + rIdx, 'grade', cols[0]); window.setVal(currentRow + rIdx, 'unit', cols[1]); window.setVal(currentRow + rIdx, 'sentence', cols[2]);
                } else if (cols.length >= 2 && startCol === 'unit') {
                    window.setVal(currentRow + rIdx, 'unit', cols[0]); window.setVal(currentRow + rIdx, 'sentence', cols[1]);
                } else if (cols.length === 1) {
                    window.setVal(currentRow + rIdx, startCol, cols[0]);
                }
            });
        };
        window.setVal = (r, c, v) => { const el = document.querySelector(`.cell-input[data-row="${r}"][data-col="${c}"]`); if(el) el.value = v.trim(); };

        window.addRow = () => {
            const table = document.getElementById('spreadsheetTable');
            const rows = table.querySelectorAll('tr').length - 1;
            table.innerHTML += `<tr><td style="text-align:center;border:1px solid #d1d5db;"><input type="checkbox" class="row-selector" data-row="${rows}"></td><td style="text-align:center;border:1px solid #d1d5db;">${rows+1}</td><td style="border:1px solid #d1d5db;"><input type="text" class="cell-input" data-row="${rows}" data-col="grade" style="width:100%;border:none;outline:none;" onpaste="window.handlePaste(event)"></td><td style="border:1px solid #d1d5db;"><input type="text" class="cell-input" data-row="${rows}" data-col="unit" style="width:100%;border:none;outline:none;" onpaste="window.handlePaste(event)"></td><td style="border:1px solid #d1d5db;"><input type="text" class="cell-input" data-row="${rows}" data-col="sentence" style="width:100%;border:none;outline:none;" onpaste="window.handlePaste(event)"></td></tr>`;
        };
        window.deleteSelectedRows = () => { document.querySelectorAll('.row-selector:checked').forEach(c => { c.closest('tr').querySelectorAll('.cell-input').forEach(i => i.value = ''); c.checked = false; }); };
        window.clearAll = () => { if(confirm("クリアしますか？")) document.querySelectorAll('.cell-input').forEach(i => i.value = ''); };
        
        window.saveProblems = () => {
            const newProbs = [];
            const inputs = Array.from(document.querySelectorAll('.cell-input'));
            for(let i=0; i<inputs.length; i+=3) {
                if(inputs[i+2].value.trim()) newProbs.push({ grade: inputs[i].value.trim() || '未分類', unit: inputs[i+1].value.trim() || '未分類', sentence: inputs[i+2].value.trim() });
            }
            if (newProbs.length > 0) { allProblems = newProbs; window.updateSelectors(); alert('保存しました！'); }
        };
        window.saveAndReturn = () => { window.saveProblems(); window.closeEditDialog(); };

        window.loadFromUrl = async () => {
            const url = document.getElementById('spreadsheetUrl').value;
            if(!url) return;
            try {
                const sheetId = url.match(/\/d\/([a-zA-Z0-9-_]+)/)?.[1];
                const gid = url.match(/gid=([0-9]+)/)?.[1] || "0";
                const res = await fetch(`https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}&t=${Date.now()}`);
                const text = await res.text();
                
                if (text.trim().startsWith('<!DOCTYPE html>') || text.includes('<html')) {
                    throw new Error("Invalid HTML response");
                }

                const rows = window.parseCSV(text);
                const newProbs = rows.slice(1).map(r => ({ grade: r[0]?.trim() || "未分類", unit: r[1]?.trim() || "未分類", sentence: r[2]?.trim() || "" })).filter(p => p.sentence);
                if (newProbs.length > 0) { allProblems = newProbs; window.updateSelectors(); window.loadProblemEditor(); alert('読み込みました'); }
            } catch(e) { alert('読み込みに失敗しました。URLや権限設定を確認してください。'); }
        };

        // ページが完全に読み込まれてから安全に初期化を実行する
        window.addEventListener('DOMContentLoaded', () => {
            window.loadProgressFromStorage();
            window.fetchProblems();
        });
  </script>
 </body>
</html>
