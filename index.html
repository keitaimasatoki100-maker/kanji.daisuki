<!doctype html>
<html lang="ja">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>漢字マスター★キングダム</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
        * { font-family: 'UD デジタル 教科書体 N-R', 'UD Digi Kyokasho N-R', '教科書体', 'BIZ UDPGothic', sans-serif; box-sizing: border-box; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; margin: 0; padding: 10px; display: flex; justify-content: center; align-items: flex-start; writing-mode: vertical-rl; text-orientation: upright; padding-top: 10px; overflow-x: auto; }
        .container { background: white; border-radius: 20px; padding: 15px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); max-height: 95vh; height: 100%; text-align: center; writing-mode: vertical-rl; text-orientation: upright; overflow-y: auto; overflow-x: auto; margin-top: 0; position: relative; display: flex; flex-direction: column; align-items: flex-start; }
        #headerArea, #readHeaderArea, #kanjiPracticeHeaderArea { margin-bottom: 20px; display: flex; flex-direction: row; align-items: flex-start; gap: 15px; writing-mode: vertical-rl; text-orientation: upright; z-index: 100; flex-shrink: 0; }
        #cardsArea, #readCardsArea, #kanjiPracticeContentArea { display: flex; flex-direction: column; flex-wrap: wrap; align-content: flex-start; height: 100%; overflow-x: auto; padding: 10px 0; }
        .title-text { color: #4a5568; font-size: 0.6rem; font-weight: bold; margin: 0; writing-mode: vertical-rl; text-orientation: upright; line-height: 1.2; }
        .sentence-card { background: #ffffff; border-radius: 15px; padding: 15px; margin: 40px 10px 10px 10px; border-top: 5px solid #667eea; writing-mode: vertical-rl; text-orientation: upright; display: inline-block; vertical-align: top; min-height: 50vh; max-height: 75vh; width: 180px; position: relative; flex-shrink: 0; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        .sentence { font-size: 1.2rem; line-height: 2.0; color: #2d3748; writing-mode: vertical-rl; text-orientation: upright; margin-top: 10px; }
        .problem-number { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); font-size: 1.2rem; font-weight: bold; color: #667eea; background: white; padding: 5px 10px; border-radius: 15px; border: 2px solid #667eea; writing-mode: vertical-rl; text-orientation: upright; }

        .top-menu { display: flex; flex-direction: column; gap: 25px; margin-right: 15%; }
        .top-menu-btn { width: 90px; height: 360px; padding: 30px 10px; font-size: 1.4rem; font-weight: bold; border: none; border-radius: 20px; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.15); transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; line-height: 1.4; letter-spacing: 0.1em; box-sizing: border-box; }
        .top-menu-btn:hover { transform: translateX(-5px); box-shadow: 0 15px 25px rgba(0,0,0,0.2); }
        .btn-flashcard { background: white; color: #ed8936; border: 4px solid #ed8936; }
        .btn-read { background: white; color: #48bb78; border: 4px solid #48bb78; }
        .btn-write { background: white; color: #4299e1; border: 4px solid #4299e1; }
        .btn-minigame { background: white; color: #d53f8c; border: 4px solid #d53f8c; }
        .btn-kanji-practice { background: white; color: #e53e3e; border: 4px solid #e53e3e; }

        .kanji-practice-unit-section { display: flex; flex-direction: column; align-items: flex-start; gap: 15px; margin-left: 40px; }
        .kanji-practice-unit-title { font-size: 1.5rem; color: #4a5568; margin: 0; font-weight: bold; border-left: 4px solid #cbd5e0; padding-left: 10px; writing-mode: vertical-rl; white-space: nowrap; }
        .kanji-practice-btn-container { display: grid; grid-template-columns: repeat(5, 60px); gap: 15px; }
        .kanji-practice-btn { background: white; border: 2px solid #e53e3e; color: #e53e3e; font-size: 2rem; width: 60px; height: 60px; border-radius: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: all 0.2s; font-family: 'Klee One', 'UD デジタル 教科書体 N-R', serif; writing-mode: horizontal-tb; padding: 0; }
        .kanji-practice-btn:hover { transform: scale(1.1); background: #fff5f5; box-shadow: 0 6px 12px rgba(229, 62, 62, 0.2); }
        .kanji-practice-btn.completed { border-color: #3182ce; color: #3182ce; background: #ebf8ff; }
        .kanji-practice-btn.completed:hover { background: #bee3f8; box-shadow: 0 6px 12px rgba(49, 130, 206, 0.2); }

        .dialog-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 5000; align-items: center; justify-content: center; writing-mode: horizontal-tb; }
        .dialog-content { background: white; padding: 25px; border-radius: 20px; max-width: 450px; width: 90%; display: flex; flex-direction: column; align-items: center; max-height: 90vh; overflow-y: auto; }
        .btn-blue { background: #3182ce; color: white; border: none; padding: 10px 20px; border-radius: 25px; cursor: pointer; font-weight: bold; }
        .loading-spinner { width: 16px; height: 16px; border: 2px solid #ffffff; border-top: 2px solid transparent; border-radius: 50%; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .reading-input { writing-mode: vertical-rl; text-orientation: upright; width: 1.5em; font-size: 1.1rem; border: 2px dashed #cbd5e0; border-radius: 6px; text-align: center; padding: 2px 0; outline: none; background: white; }
        .reading-input.correct { border-color: #48bb78; background: #f0fff4; }
        .controls { margin-right: 15px; display: flex; flex-direction: row; align-items: center; gap: 15px; writing-mode: vertical-rl; text-orientation: upright; flex-shrink: 0; padding-top: 0; }
        .progress { margin-right: 10px; font-size: 1.1rem; color: #4a5568; font-weight: bold; writing-mode: vertical-rl; text-orientation: upright; }

        .mode-switch-btn { position: fixed; left: 20px; top: 20px; background: linear-gradient(135deg, #ed8936, #dd6b20); color: white; border: none; padding: 20px 12px; border-radius: 15px; font-size: 1.1rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 1000; writing-mode: vertical-rl; text-orientation: upright; transition: transform 0.2s; }
        .mode-switch-btn:hover { transform: scale(1.05); }
        .fc-card-container { width: 350px; max-width: 90%; height: 85vh; max-height: 1200px; margin: 0 20px; }
        .fc-card-inner { width: 100%; height: 100%; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }
        @media (max-width: 600px) { .container { padding: 20px; margin: 10px; } .sentence { font-size: 1.1rem; } .fc-card-container { width: 280px; height: 85vh; } .fc-card-inner { padding: 20px; } .top-title { position: static; transform: none; font-size: 1.6rem; margin-right: 20px; white-space: nowrap; } .top-menu { margin-right: 0; gap: 10px; flex-direction: column; } .top-menu-btn { width: 60px; height: 280px; font-size: 1.1rem; padding: 15px 5px; } }

        #printPage { display: none; background: #e2e8f0; min-height: 100vh; width: 100vw; writing-mode: horizontal-tb; padding: 20px; box-sizing: border-box; overflow-y: auto; flex-direction: column; align-items: center; gap: 20px; }
        .print-controls { background: white; padding: 15px 25px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 1000px; box-sizing: border-box; z-index: 10; }
        .print-controls select { padding: 8px 12px; border-radius: 8px; border: 2px solid #cbd5e0; font-weight: bold; font-size: 1rem; cursor: pointer; outline: none; }
        
        #printAreaWrapper { display: flex; flex-direction: column; gap: 20px; align-items: center; width: 100%; max-width: 100%; overflow-x: auto; overflow-y: visible; padding-bottom: 40px; }

        .page-scaler { width: 364mm; height: 257mm; display: flex; justify-content: center; align-items: flex-start; flex-shrink: 0; position: relative; }
        .page-wrapper { margin: 0; padding: 0; width: 364mm; height: 257mm; box-shadow: 0 10px 25px rgba(0,0,0,0.15); background: white; box-sizing: border-box; position: relative; overflow: hidden; page-break-after: always; break-after: page; flex-shrink: 0; transform-origin: top left; }
        .print-area-page { width: 100%; height: 100%; padding: 8mm 10mm; box-sizing: border-box; font-family: 'Klee One', 'UD デジタル 教科書体 N-R', '教科書体', serif; background: white; overflow: hidden; position: relative; display: flex; flex-direction: row-reverse; justify-content: flex-start; align-items: stretch; gap: 6mm; writing-mode: horizontal-tb; }

        .print-meta-col { width: 32mm; height: 100%; border: 2px solid #000; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 6mm 2mm; flex-shrink: 0; writing-mode: vertical-rl; text-orientation: upright; white-space: normal; background: white; }
        .print-meta-unit-area { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; width: 100%; margin-top: 2mm; }
        .print-meta-unit-title { font-size: 15pt; font-weight: bold; margin: 0; line-height: 1.4; text-align: center; letter-spacing: 0.05em; }
        .print-meta-name-area { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; width: 100%; margin-bottom: 4mm; font-size: 12pt; font-weight: bold; white-space: nowrap; }

        .print-problems-grid { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: space-between; white-space: nowrap; overflow: visible; box-sizing: border-box; }
        .print-tier { height: 114mm; width: 100%; display: block; writing-mode: vertical-rl; text-orientation: upright; white-space: nowrap; overflow: visible; box-sizing: border-box; padding: 2mm 6mm 2mm 2mm; }
        .print-tier-divider { width: 100%; height: 1px; border-top: 1px dashed #a0aec0; margin: 1mm 0; box-sizing: border-box; }
        
        .print-problem-col { display: inline-block; vertical-align: top; width: 26mm; height: 100%; margin-left: 2.5mm; position: relative; box-sizing: border-box; text-align: center; font-size: 10pt; writing-mode: vertical-rl; text-orientation: upright; white-space: nowrap; flex-shrink: 0; }
        .print-problem-col.empty { visibility: hidden; }
        
        .print-prob-num { font-size: 11pt; font-weight: bold; margin-bottom: 2.5mm; display: inline-block; text-align: center; line-height: 1; }
        .print-prob-text-line { font-size: 10pt; line-height: 1.25; writing-mode: vertical-rl; text-orientation: upright; display: block; width: 100%; height: 100%; text-align: start; white-space: nowrap; }
        
        .print-text-char { display: inline-block; line-height: 1.15; margin: 0; }

        .print-char-block { display: inline-block; margin: 0.3mm 0; position: relative; vertical-align: middle; text-align: center; width: 10mm; }
        .print-kanji-cell { width: 10mm; height: 10mm; border: 1.5px solid #000; background: white; display: block; position: relative; box-sizing: border-box; margin: 0 auto; }
        .print-kanji-cell::before { content: ''; position: absolute; top: 0; left: 50%; width: 0; height: 100%; border-left: 1px dashed #999; }
        .print-kanji-cell::after { content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 0; border-top: 1px dashed #999; }
        .print-yomi-cell { font-size: 6.5pt; line-height: 1.05; position: absolute; right: -4mm; top: 50%; transform: translateY(-50%); width: 3.5mm; text-align: center; font-weight: bold; writing-mode: vertical-rl; text-orientation: upright; color: #000; }
        .print-ans-char { font-family: 'Klee One', 'UD デジタル 教科書体 N-R', serif; font-size: 15pt; color: #e53e3e; font-weight: bold; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 5; line-height: 1; }

        .print-bracket-cell { display: inline-block; position: relative; margin: 0.3mm 0; text-align: center; vertical-align: middle; width: 10mm; height: 15mm; }
        .print-bracket-cell::before { content: '〔'; font-size: 10pt; position: absolute; top: 0; left: 50%; transform: translateX(-50%); }
        .print-bracket-cell::after { content: '〕'; font-size: 10pt; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); }
        .print-bracket-ans { font-family: 'Klee One', 'UD デジタル 教科書体 N-R', serif; font-size: 10pt; color: #e53e3e; font-weight: bold; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); writing-mode: vertical-rl; text-orientation: upright; }
        .print-bracket-side-yomi { font-size: 6.5pt; position: absolute; right: -4mm; top: 50%; transform: translateY(-50%); writing-mode: vertical-rl; text-orientation: upright; font-weight: bold; text-align: center; width: 3.5mm; }

        @media print {
            @page { size: B4 landscape; margin: 0; }
            body { background: white !important; margin: 0 !important; padding: 0 !important; writing-mode: horizontal-tb !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            #topPage, #mainContainer, #readingContainer, #flashcardPage, #minigameMenuPage, #minigamePlayPage, #backToTopBtnMain, #editDialog, #kanjiDetailModal, #kanjiPracticeContainer, .print-controls, .print-hint { display: none !important; }
            #printPage { display: block !important; position: static !important; width: auto !important; height: auto !important; background: white !important; overflow: visible !important; padding: 0 !important; }
            #printAreaWrapper { margin: 0 !important; padding: 0 !important; display: block !important; max-width: none !important; gap: 0 !important; }
            .page-scaler { width: 364mm !important; height: 257mm !important; display: block !important; }
            .page-wrapper { margin: 0 auto !important; padding: 0 !important; width: 364mm !important; height: 257mm !important; page-break-after: always !important; break-after: page !important; box-shadow: none !important; transform: none !important; }
            .page-wrapper:last-child { page-break-after: auto !important; break-after: auto !important; }
            .print-area-page { box-shadow: none !important; margin: 0 !important; width: 364mm !important; height: 257mm !important; }
            .page-break { display: none !important; }
        }

        .edit-controls { margin-bottom: 15px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
        .btn-red { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .btn-gray { background: #6b7280; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }

        .toast-msg { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #2d3748; color: white; padding: 12px 24px; border-radius: 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); font-weight: bold; z-index: 10000; writing-mode: horizontal-tb; text-align: center; font-size: 1.1rem; pointer-events: none; transition: opacity 0.3s ease; opacity: 0; }
        .toast-msg.show { opacity: 1; }
  </style>
 </head>
 <body>
  <div id="toastMessage" class="toast-msg"></div>

  <div id="topPage" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); z-index: 4000; display: flex; flex-direction: column; align-items: center; justify-content: center; writing-mode: vertical-rl; text-orientation: upright;">
      <h1 class="top-title" style="margin-right: 5%; color: white; font-size: 2.2rem; font-weight: bold;">漢字マスター★キングダム</h1>
      <div class="top-menu">
          <button class="top-menu-btn btn-kanji-practice" onclick="goToKanjiPracticeMode()">
              <span>漢字練習</span>
              <span id="topKanjiPracticeScore" style="margin-top: 25px; font-size: 1.2rem; font-weight: bold; writing-mode: horizontal-tb;">0 pt</span>
          </button>
          <button class="top-menu-btn btn-flashcard" onclick="goToFlashcardMode()"><span>フラッシュカード</span></button>
          <button class="top-menu-btn btn-read" onclick="goToReadingMode()">
              <span>正しく読めるかな？</span>
              <span id="topReadScore" style="margin-top: 25px; font-size: 1.2rem; font-weight: bold; writing-mode: horizontal-tb;">0 pt</span>
          </button>
          <button class="top-menu-btn btn-write" onclick="goToPracticeMode()">
              <span>正しく書けるかな？</span>
              <span style="font-size: 0.9rem; font-weight: normal; margin-right: 15px; line-height: 1.4;">えんぴつとノートをよういしてね</span>
          </button>
          <button id="topMinigameBtn" class="top-menu-btn btn-minigame" onclick="goToMinigameMenu()">
              <span>ミニゲーム</span>
          </button>
      </div>
  </div>

  <button id="backToTopBtnMain" class="mode-switch-btn" onclick="goToTopMode()" style="display: none; background: #718096;">トップへ戻る</button>

  <div class="container" id="kanjiPracticeContainer" style="display: none;">
      <div id="kanjiPracticeHeaderArea">
          <select id="kanjiPracticeSelector" onchange="onKanjiPracticeGradeChange()" style="background: white; border: 2px solid #cbd5e0; border-radius: 12px; padding: 8px 12px; font-size: 0.7rem; font-weight: bold; cursor: pointer; writing-mode: vertical-rl;">
              <option value="">読込中...</option>
          </select>
      </div>
      <div id="kanjiPracticeContentArea" class="kanji-practice-content"></div>
  </div>

  <div class="container" id="mainContainer" style="display: none;">
      <div id="headerArea">
          <select id="gradeSelector" onchange="onGradeChange()" style="background: white; border: 2px solid #cbd5e0; border-radius: 12px; padding: 8px 12px; font-size: 0.7rem; font-weight: bold; cursor: pointer; writing-mode: vertical-rl;"><option value="">学年...</option></select>
          <select id="unitSelector" onchange="onUnitChange()" style="background: white; border: 2px solid #cbd5e0; border-radius: 12px; padding: 8px 12px; font-size: 0.7rem; font-weight: bold; cursor: pointer; writing-mode: vertical-rl;"><option value="">単元...</option></select>
          <select id="rangeSelector" onchange="onRangeChange()" style="background: white; border: 2px solid #cbd5e0; border-radius: 12px; padding: 8px 12px; font-size: 0.7rem; font-weight: bold; cursor: pointer; writing-mode: vertical-rl;">
              <option value="up-to">まで</option>
              <option value="only" selected>だけ</option>
          </select>
      </div>
      <div style="color: #e53e3e; font-weight: bold; font-size: 1.5rem; margin-right: 15px; writing-mode: vertical-rl; flex-shrink: 0; white-space: nowrap;">ノートに正しい字を書けるかな？</div>
      <div id="cardsArea"></div>
      <div id="writeSentenceDisplay" class="sentence" style="margin-right: 30px; display: none;"></div>
  </div>

  <div class="container" id="readingContainer" style="display: none; max-height: 95vh; overflow: hidden;">
      <div id="readHeaderArea">
          <select id="readGradeSelector" onchange="onReadGradeChange()" style="background: white; border: 2px solid #cbd5e0; border-radius: 12px; padding: 8px 12px; font-size: 0.7rem; font-weight: bold; cursor: pointer; writing-mode: vertical-rl;"><option value="">学年...</option></select>
          <select id="readUnitSelector" onchange="onReadUnitChange()" style="background: white; border: 2px solid #cbd5e0; border-radius: 12px; padding: 8px 12px; font-size: 0.7rem; font-weight: bold; cursor: pointer; writing-mode: vertical-rl;"><option value="">単元...</option></select>
          <select id="readRangeSelector" onchange="onReadRangeChange()" style="display: none;"><option value="only" selected>だけ</option></select>
      </div>
      <div style="display: flex; flex-direction: row; gap: 15px; margin-right: 20px; align-items: center; flex-shrink: 0;">
          <div id="readProgress" class="progress" style="margin: 0;">0 / 0</div>
          <div id="readScoreDisplay" style="margin: 0; color: #ed8936; font-size: 1.1rem; font-weight: bold; writing-mode: horizontal-tb;">0 pt</div>
          <div id="readTimerDisplay" style="margin: 0; color: #e53e3e; font-size: 1.1rem; font-weight: bold; writing-mode: horizontal-tb;"></div>
      </div>
      
      <div id="readTimeSelectArea" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; margin: auto; padding: 20px; flex-grow: 1;">
          <div style="font-size: 1.4rem; font-weight: bold; color: #2d3748; writing-mode: vertical-rl; margin-bottom: 10px;">じかんをえらんでスタート！</div>
          <div style="display: flex; flex-direction: row; gap: 20px; writing-mode: vertical-rl;">
              <button onclick="startReadingGame(180)" style="padding: 25px 12px; font-size: 1.3rem; font-weight: bold; background: #ed8936; color: white; border-radius: 15px; border: none; cursor: pointer; box-shadow: 0 4px 10px rgba(237, 137, 54, 0.3); transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">三分間</button>
              <button onclick="startReadingGame(300)" style="padding: 25px 12px; font-size: 1.3rem; font-weight: bold; background: #4299e1; color: white; border-radius: 15px; border: none; cursor: pointer; box-shadow: 0 4px 10px rgba(66, 153, 225, 0.3); transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">五分間</button>
              <button onclick="startReadingGame(null)" style="padding: 25px 12px; font-size: 1.3rem; font-weight: bold; background: #48bb78; color: white; border-radius: 15px; border: none; cursor: pointer; box-shadow: 0 4px 10px rgba(72, 187, 120, 0.3); transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">無制限</button>
          </div>
      </div>

      <div id="readGameArea" style="display: none; flex-direction: row; align-items: center; justify-content: center; height: 100%; max-height: 100%; gap: 15px; flex-shrink: 0;">
          <div id="readCardsArea" style="display: flex; align-items: center; justify-content: center; height: 100%; max-height: 100%;"></div>
          <div class="controls" style="gap: 15px; margin-right: 5px; padding-top: 0; flex-shrink: 0;">
              <button onclick="prevReadingProblem()" style="padding: 15px 8px; font-size: 1rem; font-weight: bold; background: #e2e8f0; color: #4a5568; border-radius: 12px; border: none; cursor: pointer; writing-mode: vertical-rl;">前へ</button>
              <button onclick="nextReadingProblem()" style="padding: 15px 8px; font-size: 1rem; font-weight: bold; background: #48bb78; color: white; border-radius: 12px; border: none; cursor: pointer; writing-mode: vertical-rl;">次へ</button>
          </div>
      </div>
  </div>

  <div id="flashcardPage" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:#dcfce7; z-index:3000; flex-direction:column; align-items:center; justify-content:center; writing-mode:vertical-rl; text-orientation:upright;">
      <div style="position: absolute; top: 20px; left: 20px;">
          <button onclick="goToTopMode()" style="background: #718096; color: white; border: none; padding: 22px 15px; border-radius: 15px; font-size: 1.5rem; font-weight: bold; cursor: pointer; writing-mode: vertical-rl;">トップへ戻る</button>

        window.getCircleNumber = function(num) {
            if (num >= 1 && num <= 20) return String.fromCharCode(0x245F + num);
            if (num >= 21 && num <= 35) return String.fromCharCode(0x3251 + num - 21);
            if (num >= 36 && num <= 50) return String.fromCharCode(0x32B1 + num - 36);
            return `(${num})`;
        }
        window.getHash = function(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) hash = ((hash << 5) - hash) + str.charCodeAt(i) | 0;
            return Math.abs(hash).toString(36);
        }

        window.parseCSV = function(text) {
            const rows = [];
            let row = [];
            let val = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (c === '"') {
                    if (inQuotes && text[i+1] === '"') {
                        val += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (c === ',' && !inQuotes) {
                    row.push(val);
                    val = '';
                } else if ((c === '\n' || c === '\r') && !inQuotes) {
                    if (c === '\r' && text[i+1] === '\n') i++;
                    row.push(val);
                    rows.push(row);
                    row = [];
                    val = '';
                } else {
                    val += c;
                }
            }
            if (row.length > 0 || val !== '') {
                row.push(val);
                rows.push(row);
            }
            return rows;
        };

            }
            return text;

        window.onKanjiPracticeGradeChange = async () => {
            const grade = document.getElementById('kanjiPracticeSelector').value;
            window.syncGrade(grade);

            if (!kanjiPracticeDataLoaded) {
                await window.loadKanjiPracticeData();
                document.getElementById('kanjiPracticeSelector').value = grade;
            }

            const content = document.getElementById('kanjiPracticeContentArea');
            content.innerHTML = '';
            if (!grade) return;
            
            const unitsMap = new Map();
            const unitsOrder = [];
            
            kanjiPracticeRawData.slice(1).forEach(r => {
                const rowGrade = r[0]?.trim();
                if (rowGrade !== grade) return;
                
                const unit = (r.length > 19 ? r[19]?.trim() : '') || '未分類';
                
                if (!unitsMap.has(unit)) { 
                    unitsMap.set(unit, new Set()); 
                    unitsOrder.push(unit); 
                }
                
                let kanjiData = r.length > 23 ? r[23]?.trim() : '';
                if (!kanjiData || kanjiData.trim() === '') {
                    for (let i = 20; i < r.length; i++) {
                        const cell = r[i] || '';
                        if (cell.match(/[\u4E00-\u9FFF々]/) && !cell.includes('{')) {
                            kanjiData += cell;
                        }
                    }
                }

                if (kanjiData) {
                    for (const char of kanjiData) {
                        if (char.match(/[\u4E00-\u9FFF々]/)) {
                            unitsMap.get(unit).add(char);
                        }
                    }
                }
            });

            unitsOrder.forEach(u => {
                const kanjis = Array.from(unitsMap.get(u));
                if (kanjis.length === 0) return;
                const sec = document.createElement('div');
                sec.className = 'kanji-practice-unit-section';
                sec.innerHTML = `<div class="kanji-practice-unit-title">${u}</div>`;

                    const btn = document.createElement('button');
                    btn.className = 'kanji-practice-btn' + (completedKanjis.has(k) ? ' completed' : '');
                    btn.textContent = k;
                    btn.dataset.kanji = k;
                    btn.onclick = () => window.showKanjiDetail(k);
                    grid.appendChild(btn);
                });
                sec.appendChild(grid);
                content.appendChild(sec);
            });
        };

        window.playKanjiAnimation = async function(kanji, container) {
            const animId = ++currentAnimId;
            const code = kanji.charCodeAt(0).toString(16).padStart(5, '0');
            const url = `https://cdn.jsdelivr.net/gh/KanjiVG/kanjivg@master/kanji/${code}.svg`;
            try {
                const res = await fetch(url);
                let svgText = await res.text();
                const svgMatch = svgText.match(/<svg[^>]*>[\s\S]*<\/svg>/i);
                if (svgMatch) svgText = svgMatch[0];
                
                if (currentAnimId !== animId) return;

                for (let loop = 0; loop < 3; loop++) {
                    if (currentAnimId !== animId) break;
                    
                    container.innerHTML = svgText;
                    const svg = container.querySelector('svg');
                    if (!svg) return;
                    svg.querySelectorAll('text').forEach(t => t.remove());
                    svg.style.cssText = 'width:100%;height:100%;display:block;';
                    const paths = Array.from(svg.querySelectorAll('path'));

                    paths.forEach(p => {
                        const len = p.getTotalLength();
                        p.style.cssText = `fill:none;stroke:#3182ce;stroke-width:4;stroke-linecap:round;stroke-dasharray:${len};stroke-dashoffset:${len}`;
                    });

                    for (const p of paths) {
                        if (currentAnimId !== animId) break;
                        const len = p.getTotalLength();
                        const anim = p.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: 600, fill: 'forwards' });
                        await new Promise(resolve => {
                            anim.onfinish = resolve;
                            anim.oncancel = resolve;
                        });
                        p.style.strokeDashoffset = '0'; 
                    }
                    if (loop < 2 && currentAnimId === animId) await new Promise(r => setTimeout(r, 1000));
                }
            } catch(e) { 
                if (currentAnimId === animId) {
                    container.innerHTML = `<span style="font-size:4rem;">${kanji}</span>`; 
                }
            }
        }

        window.playAssembleAnimation = async function(kanji, container) {
            const animId = ++currentAnimId;
            const code = kanji.charCodeAt(0).toString(16).padStart(5, '0');
            const url = `https://cdn.jsdelivr.net/gh/KanjiVG/kanjivg@master/kanji/${code}.svg`;
            try {
                const res = await fetch(url);
                let svgText = await res.text();
                const svgMatch = svgText.match(/<svg[^>]*>[\s\S]*<\/svg>/i);
                if (svgMatch) svgText = svgMatch[0];

                if (currentAnimId !== animId) return;
                
                container.innerHTML = svgText;
                const svg = container.querySelector('svg');
                if (!svg) return;
                svg.querySelectorAll('text').forEach(t => t.remove());
                svg.style.cssText = 'width:100%;height:100%;display:block;overflow:visible;';
                const strokePathsGroup = svg.querySelector('g[id^="kvg:StrokePaths_"]');
                const parts = [];
                const extract = (node) => {
                    const children = Array.from(node.children);
                    if (!children.some(c => c.tagName.toLowerCase() === 'g')) {
                        if (node === strokePathsGroup) children.forEach(c => parts.push(c));
                        else parts.push(node);
                    } else {
                        children.forEach(c => c.tagName.toLowerCase() === 'g' ? extract(c) : parts.push(c));
                    }
                };
                if (strokePathsGroup) extract(strokePathsGroup);
                
                const colors = ['#e53e3e', '#3182ce', '#38a169', '#dd6b20', '#805ad5', '#d53f8c'];
                parts.forEach((p, i) => {
                    const color = colors[i % colors.length];
                    const pths = p.tagName.toLowerCase() === 'path' ? [p] : Array.from(p.querySelectorAll('path'));
                    pths.forEach(pth => {
                        pth.style.cssText = `fill:none;stroke:${color};stroke-width:4;stroke-linecap:round;`;
                    });
                    p.style.opacity = '0';
                });
                for (const p of parts) {
                    if (currentAnimId !== animId) break;
                    const angle = Math.random() * Math.PI * 2;
                    const anim = p.animate([
                        { transform: `translate(${Math.cos(angle)*150}px, ${Math.sin(angle)*150}px) scale(0.2)`, opacity: 0 },

        window.playCorrectSound = function() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const playTone = (freq, startTime, duration) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + startTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime + startTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + startTime + duration);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + startTime);
                    osc.stop(ctx.currentTime + startTime + duration);
                };
                playTone(784, 0, 0.2);
                playTone(1046.5, 0.2, 0.4);
            } catch(e) {}
        };

        window.createWordAnswerBox = function(word, reading) {
            const block = document.createElement('div');
            block.style.cssText = 'display:flex; flex-direction:column; align-items:center; gap:20px; writing-mode: vertical-rl; margin-bottom: 10px;';
            const size = 125; 
            
            const ansGroup = document.createElement('div');
            ansGroup.style.cssText = 'display: flex; flex-direction: column; align-items: center; gap: 10px; writing-mode: horizontal-tb;';

            const ansDisplayWrapper = document.createElement('div');
            ansDisplayWrapper.style.cssText = 'display: flex; flex-direction: column; gap: 10px;';
            
            const charDisplays = [];
            const chars = Array.from(word);
            for (const char of chars) {
                const ansDisplay = document.createElement('div');
                ansDisplay.style.cssText = `width:${size}px; height:${size}px; border:2px solid #cbd5e0; background:#f7fafc; border-radius: 8px; display: flex; align-items: center; justify-content: center; position: relative; writing-mode: horizontal-tb;`;
                ansDisplayWrapper.appendChild(ansDisplay);
                charDisplays.push({ char, el: ansDisplay });
            }

            const ansBtn = document.createElement('button');
            ansBtn.textContent = '答え';
            ansBtn.style.cssText = 'width: 100%; min-width: 60px; background:white; border:2px solid #cbd5e0; border-radius:6px; padding:5px 0; font-weight:bold; cursor:pointer; font-size: 0.9rem; color: #4a5568; box-sizing: border-box; text-align: center; writing-mode: horizontal-tb;';

            let currentLocalAnimId = 0;
            ansBtn.onclick = async () => {
                const animId = ++currentLocalAnimId;
                const svgDataArray = [];
                for (const item of charDisplays) {
                    const code = item.char.charCodeAt(0).toString(16).padStart(5, '0');
                    const url = `https://cdn.jsdelivr.net/gh/KanjiVG/kanjivg@master/kanji/${code}.svg`;
                    let svgText = '';
                    try {
                        const res = await fetch(url);
                        svgText = await res.text();
                        const svgMatch = svgText.match(/<svg[^>]*>[\s\S]*<\/svg>/i);
                        if (svgMatch) svgText = svgMatch[0];
                    } catch(e) {
                        svgText = null;
                    }
                    svgDataArray.push(svgText);
                }
                
                if (currentLocalAnimId !== animId) return;

                charDisplays.forEach(item => {
                    item.el.style.background = '#ebf8ff';
                    item.el.style.borderColor = '#63b3ed';
                });
                
                for (let loop = 0; loop < 3; loop++) {
                    if (currentLocalAnimId !== animId) break;
                    
                    const animPromises = charDisplays.map(async (item, i) => {
                        const svgText = svgDataArray[i];
                        if (svgText) {
                            item.el.innerHTML = svgText;
                            const svg = item.el.querySelector('svg');
                            if (svg) {
                                svg.querySelectorAll('text').forEach(t=>t.remove());
                                svg.style.cssText = 'width:90%;height:90%;display:block;';
                                const paths = Array.from(svg.querySelectorAll('path'));
                                paths.forEach(p => {
                                    const len = p.getTotalLength();
                                    p.style.cssText = `fill:none;stroke:#3182ce;stroke-width:4;stroke-linecap:round;stroke-dasharray:${len};stroke-dashoffset:${len}`;
                                });

                                for (const p of paths) {
                                    if (currentLocalAnimId !== animId) break;
                                    const len = p.getTotalLength();
                                    const anim = p.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: 600, fill: 'forwards' });
                                    await new Promise(resolve => {
                                        anim.onfinish = resolve;
                                        anim.oncancel = resolve;
                                    });
                                    p.style.strokeDashoffset = '0'; 
                                }
                            }
                        } else {
                            item.el.innerHTML = `<span style="font-size: ${size * 0.6}px; color: #3182ce; font-family: 'Klee One', serif;">${item.char}</span>`;
                        }
                    });
                    
                    await Promise.all(animPromises);
                    if (loop < 2 && currentLocalAnimId === animId) await new Promise(r => setTimeout(r, 1000));
                }
            };

            ansGroup.appendChild(ansDisplayWrapper);
            ansGroup.appendChild(ansBtn);
            block.appendChild(ansGroup);
            return block;
        }

        window.handleReadingKeydown = function(event, input, answer) {
            if (event.key === 'Enter') {
                event.preventDefault();
                const userVal = input.value.trim().replace(/[\u30a1-\u30f6]/g, m => String.fromCharCode(m.charCodeAt(0)-0x60));
                if (userVal === answer) {
                    window.checkReading(input, answer);
                } else if (userVal !== '') {
                    input.value = answer;
                    input.style.color = '#e53e3e';
                    input.dataset.mustClear = "true";
                } else {
                    window.nextReadingInput(input);
                }
            }
        };

        window.checkReading = function(input, answer) {
            input.style.color = '';
            
            if (input.dataset.clearTimer) {
                clearTimeout(parseInt(input.dataset.clearTimer, 10));
                delete input.dataset.clearTimer;
            }
            
            if (input.dataset.mustClear === "true") {
                if (input.value !== answer && input.value !== '') {
                    input.value = '';
                }
                if (input.value === '') {
                    input.dataset.mustClear = "false";
                    const circle = input.parentElement.querySelector('.correct-mark');
                    if (circle) circle.remove();
                }
                return;
            }

            const userVal = input.value.trim().replace(/[\u30a1-\u30f6]/g, m => String.fromCharCode(m.charCodeAt(0)-0x60));
            if (userVal.match(/[a-zA-Z]/)) return;

            if (userVal === answer) {
                window.playCorrectSound();

                input.classList.add('correct');
                input.disabled = true;

                let circle = input.parentElement.querySelector('.correct-mark');
                if (!circle) {
                    circle = document.createElement('span');
                    circle.className = 'correct-mark';
                    circle.textContent = '〇';
                    circle.style.cssText = 'position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #e53e3e; font-size: 2.2rem; font-weight: bold; pointer-events: none; opacity: 0.8; z-index: 10; font-family: sans-serif; writing-mode: horizontal-tb;';
                    input.parentElement.appendChild(circle);
                }

                readScore += 3;
                window.updateScoreDisplay();
                const allInputs = Array.from(document.querySelectorAll('.reading-input'));
                if(allInputs.every(i => i.classList.contains('correct'))) {
                    setTimeout(() => window.nextReadingProblem(), 1000);
                } else {
                    const next = allInputs.find(i => !i.classList.contains('correct'));
                    if (next) next.focus();
                }
            } else if (userVal.length >= 10 && !answer.startsWith(userVal)) {
                input.value = answer;
                input.style.color = '#e53e3e';
                input.dataset.mustClear = "true";
            }
        };

        window.nextReadingInput = (currentInput) => {
            const allInputs = Array.from(document.querySelectorAll('.reading-input'));
            const idx = allInputs.indexOf(currentInput);
            if (idx > -1 && idx < allInputs.length - 1) {
                allInputs[idx + 1].focus();

        window.renderPrintPreview = () => {
            const container = document.getElementById('printAreaWrapper');
            container.innerHTML = '';
            const grade = document.getElementById('printGradeSelector').value;
            const unit = document.getElementById('printUnitSelector').value;
            const range = document.getElementById('printRangeSelector').value;
            if (!grade || !unit) { container.innerHTML = '<div style="padding:50px; font-weight: bold; writing-mode: horizontal-tb;">学年と単元を選択してください。</div>'; return; }

            let filtered = allProblems.filter(p => p.grade === grade);
            if (unit !== 'all') {
                if (range === 'only') {
                    filtered = filtered.filter(p => p.unit === unit);
                } else {
                    const currentUnits = [...new Set(filtered.map(p => p.unit))];
                    const targetIdx = currentUnits.indexOf(unit);
                    filtered = filtered.filter(p => currentUnits.indexOf(p.unit) <= targetIdx);
                }
            }
            if (range === 'up-to') filtered = filtered.sort(() => Math.random() - 0.5).slice(0, 50);

            if (filtered.length === 0) { container.innerHTML = '<div style="padding:50px; font-weight: bold; writing-mode: horizontal-tb;">問題がありません。</div>'; return; }

            const chunks = [];
            for (let i = 0; i < filtered.length; i += 20) {
                chunks.push(filtered.slice(i, i + 20));
            }

            chunks.forEach((probs, pIdx) => {
                const totalPages = chunks.length;
                const pageNumDisplay = totalPages > 1 ? `${pIdx + 1} / ${totalPages}` : "";
                const unitTitle = unit === 'all' ? 'すべて' : unit;
                
                const qPageScaler = document.createElement('div');
                qPageScaler.className = 'page-scaler';
                const qPage = window.createPrintPageDOM(grade, unitTitle, probs, pIdx * 20, false, pageNumDisplay);
                qPageScaler.appendChild(qPage);
                container.appendChild(qPageScaler);
                
                const pageBreak1 = document.createElement('div');
                pageBreak1.className = 'page-break';
                container.appendChild(pageBreak1);
                
                const aPageScaler = document.createElement('div');
                aPageScaler.className = 'page-scaler';
                const aPage = window.createPrintPageDOM(grade, unitTitle + " 【解答】", probs, pIdx * 20, true, pageNumDisplay);
                aPageScaler.appendChild(aPage);
                container.appendChild(aPageScaler);
                
                if (pIdx < chunks.length - 1) {
                    const pageBreak2 = document.createElement('div');
                    pageBreak2.className = 'page-break';
                    container.appendChild(pageBreak2);
                }
            });

            setTimeout(() => {
                window.adjustPrintPreviewScale();
            }, 50);
        };

        window.adjustPrintPreviewScale = function() {
            const scalers = document.querySelectorAll('.page-scaler');
            const container = document.getElementById('printAreaWrapper');
            if (!container || scalers.length === 0) return;

            const b4WidthPx = 1375.75; // 364mm at 96DPI
            const b4HeightPx = 971.34; // 257mm at 96DPI

            const availableWidth = Math.max(280, Math.min(container.clientWidth - 40, 1350));

            if (availableWidth < b4WidthPx) {
                const scale = availableWidth / b4WidthPx;
                scalers.forEach(scaler => {
                    scaler.style.width = `${b4WidthPx * scale}px`;
                    scaler.style.height = `${b4HeightPx * scale}px`;
                    const wrap = scaler.querySelector('.page-wrapper');
                    if (wrap) {
                        wrap.style.transform = `scale(${scale})`;
                        wrap.style.transformOrigin = 'top left';
                    }
                });
            } else {
                scalers.forEach(scaler => {
                    scaler.style.width = `${b4WidthPx}px`;
                    scaler.style.height = `${b4HeightPx}px`;
                    const wrap = scaler.querySelector('.page-wrapper');
                    if (wrap) {
                        wrap.style.transform = 'none';
                    }
                });
            }
        };

        window.createPrintPageDOM = function(grade, unitTitle, problems, startIdx, showAns, pageNumDisplay) {
            const wrap = document.createElement('div');
            wrap.className = 'page-wrapper';
            
            const page = document.createElement('div');
            page.className = 'print-area-page';

            let displayTitle = unitTitle || '';
            if (grade && !displayTitle.includes(grade)) {
                displayTitle = grade + ' ' + displayTitle;
            }

            let metaHtml = `
                <div class="print-meta-col">
                    <div class="print-meta-unit-area">
                        <h2 class="print-meta-unit-title">${displayTitle}</h2>
                    </div>
                    <div class="print-meta-name-area">
                        名前（<span style="letter-spacing: -0.2em;">　　　　　　　　</span>）
                    </div>
                </div>
            `;

            const renderTierHtml = (tierProbs, tierStartIdx) => {
                let tierHtml = `<div class="print-tier">`;
                tierProbs.forEach((prob, idx) => {
                    const circleNum = window.getCircleNumber(tierStartIdx + idx + 1);
                    let sentenceBlocksHtml = '';
                    
                    const sentenceText = prob.sentence || '';
                    const parts = sentenceText.split(/(\{.+?\|.+?\})/);
                    
                    parts.forEach(part => {
                        if (part.startsWith('{') && part.endsWith('}')) {
                            let [kanji, reading] = part.slice(1, -1).split('|');
                            if (!kanji) kanji = '';
                            if (!reading) reading = '';
                            
                            const kanjiChars = Array.from(kanji);
                            const isAllKanji = kanjiChars.length > 0 && kanjiChars.every(c => c.match(/[\u4E00-\u9FFF々]/));
                            
                            if (isAllKanji) {
                                kanjiChars.forEach((char, cIdx) => {
                                    let charYomi = reading;
                                    if (kanjiChars.length > 1) {
                                        const yomiLen = Math.ceil(reading.length / kanjiChars.length);
                                        charYomi = reading.substring(cIdx * yomiLen, (cIdx + 1) * yomiLen);
                                    }
                                    sentenceBlocksHtml += `
                                        <span class="print-char-block">
                                            <span class="print-kanji-cell">
                                                ${showAns ? `<span class="print-ans-char">${char}</span>` : ''}
                                            </span>
                                            <span class="print-yomi-cell">
                                                ${Array.from(charYomi || '').map(ch => `<span>${ch}</span>`).join('')}
                                            </span>
                                        </span>
                                    `;
                                });
                            } else {
                                let currentKanjiPart = '';
                                let currentKanaPart = '';
                                
                                kanjiChars.forEach(char => {
                                    if (char.match(/[\u4E00-\u9FFF々]/)) {
                                        currentKanjiPart += char;
                                    } else {
                                        currentKanaPart += char;
                                    }
                                });
                                
                                let pureYomi = reading;
                                if (currentKanaPart && reading && reading.endsWith(currentKanaPart)) {
                                    pureYomi = reading.substring(0, reading.length - currentKanaPart.length);
                                }

                                Array.from(currentKanjiPart).forEach((char, cIdx) => {
                                    let charYomi = pureYomi;
                                    if (currentKanjiPart.length > 1 && pureYomi) {
                                        const yomiLen = Math.ceil(pureYomi.length / currentKanjiPart.length);
                                        charYomi = pureYomi.substring(cIdx * yomiLen, (cIdx + 1) * yomiLen);
                                    }
                                    sentenceBlocksHtml += `
                                        <span class="print-char-block">
                                            <span class="print-kanji-cell">
                                                ${showAns ? `<span class="print-ans-char">${char}</span>` : ''}
                                            </span>
                                            <span class="print-yomi-cell">
                                                ${Array.from(charYomi || '').map(ch => `<span>${ch}</span>`).join('')}
                                            </span>
                                        </span>
                                    `;
                                });

                                if (currentKanaPart) {
                                    sentenceBlocksHtml += `
                                        <span class="print-bracket-cell">
                                            ${showAns ? `<span class="print-bracket-ans">${currentKanaPart}</span>` : ''}
                                            <span class="print-bracket-side-yomi">${currentKanaPart}</span>
                                        </span>
                                    `;
                                }
                            }
                        } else {
                            sentenceBlocksHtml += Array.from(part || '').map(char => {
                                return `<span class="print-text-char">${char}</span>`;
                            }).join('');
                        }
                    });
                    
                    tierHtml += `
                        <div class="print-problem-col">
                            <div class="print-prob-text-line">
                                <span class="print-prob-num">${circleNum}</span>
                                ${sentenceBlocksHtml}
                            </div>
                        </div>
                    `;
                });

                for (let j = tierProbs.length; j < 10; j++) {
                    tierHtml += `<div class="print-problem-col empty"></div>`;
                }

                tierHtml += `</div>`;
                return tierHtml;
            };

            const topProbs = problems.slice(0, 10);
            const bottomProbs = problems.slice(10, 20);

            let problemsHtml = `<div class="print-problems-grid">`;
            problemsHtml += renderTierHtml(topProbs, startIdx);
            problemsHtml += `<div class="print-tier-divider"></div>`;
            problemsHtml += renderTierHtml(bottomProbs, startIdx + 10);
            problemsHtml += `</div>`;
            
            page.innerHTML = metaHtml + problemsHtml;
            wrap.appendChild(page);
            return wrap;
        }

            printWin.document.close();
        };

            if (currentMgType === 'kotowaza') {
                const inputWrap = document.createElement('div');
                inputWrap.style.cssText = 'display: flex; flex-direction: column; align-items: center; gap: 15px; width: 100%;';
                
                const input = document.createElement('input');
                input.type = 'text';
                input.placeholder = '漢字かひらがなで入力';
                input.style.cssText = 'padding: 15px 20px; font-size: 2rem; border-radius: 15px; border: 3px solid #cbd5e0; text-align: center; outline: none; width: 80%; max-width: 400px;';
                
                input.oninput = () => {
                    const userVal = input.value.trim();
                    const userYomi = userVal.replace(/[\u30a1-\u30f6]/g, m => String.fromCharCode(m.charCodeAt(0)-0x60));
                    if (userVal !== "" && (userVal === prob.aKanji || userYomi === prob.aYomi) && !input.disabled) {
                        window.playCorrectSound();
                        input.disabled = true;
                        window.handleMgAnswer(true, null);
                    }
                };
                
                input.onkeydown = (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        const userVal = input.value.trim();
                        const userYomi = userVal.replace(/[\u30a1-\u30f6]/g, m => String.fromCharCode(m.charCodeAt(0)-0x60));
                        if (userVal !== "" && (userVal === prob.aKanji || userYomi === prob.aYomi)) {
                            if (!input.disabled) {
                                window.playCorrectSound();
                                input.disabled = true;
                                window.handleMgAnswer(true, null);
                            }
                        } else if (userVal !== '') {
                            input.disabled = true;
                            window.handleMgAnswer(false, null);
                        }
                    }
                };
                
                inputWrap.appendChild(input);
                choicesContainer.appendChild(inputWrap);
                setTimeout(() => input.focus(), 100);
            } else {
                [...prob.choices].sort(() => Math.random() - 0.5).forEach(choice => {
                    const btn = document.createElement('button');
                    btn.textContent = choice;
                    btn.style.cssText = 'padding:15px 30px; font-size:1.8rem; border-radius:15px; border:2px solid #cbd5e0; background:white; color:#4a5568; cursor:pointer; font-weight:bold; min-width:200px; transition:all 0.2s;';
                    btn.onmouseover = () => { btn.style.background = '#edf2f7'; btn.style.transform = 'scale(1.05)'; };
                    btn.onmouseout = () => { btn.style.background = 'white'; btn.style.transform = 'scale(1)'; };
                    btn.onclick = () => window.handleMgAnswer(choice === prob.a, btn);
                    choicesContainer.appendChild(btn);
                });
            }
        };

        window.handleMgAnswer = (isCorrect, btn) => {
            if (currentMgType !== 'kotowaza') {
                if (isCorrect) { btn.style.background = '#c6f6d5'; btn.style.borderColor = '#48bb78'; btn.style.color = '#2f855a'; currentMgScore++; }
                else { btn.style.background = '#fed7d7'; btn.style.borderColor = '#f56565'; btn.style.color = '#c53030'; }
            } else {
                if (isCorrect) currentMgScore++;
            }
            
            const overlay = document.getElementById('mgResultOverlay');
            overlay.style.display = 'flex';
            document.getElementById('mgResultMark').textContent = isCorrect ? '◯' : '✖';
            document.getElementById('mgResultMark').style.color = isCorrect ? '#48bb78' : '#f56565';
            
            const currentProb = currentMgData[currentMgIndex];
            const displayAns = currentMgType === 'kotowaza' ? `${currentProb.aKanji}（${currentProb.aYomi}）` : currentProb.a;
            document.getElementById('mgResultText').textContent = isCorrect ? 'せいかい！' : `ざんねん... せいかいは「${displayAns}」`;
            
            setTimeout(() => { overlay.style.display = 'none'; currentMgIndex++; window.loadMgQuestion(); }, 1500);
        };

        window.endMinigame = () => {
            if (mgTimerInterval) clearInterval(mgTimerInterval);
            const diffInSec = Math.floor((Date.now() - mgStartTime) / 1000);
            
            const recordKey = currentMgType === 'kotowaza' ? `kotowaza_${currentMgCategory}` : currentMgType;
            window.checkAndSaveMgRecord(recordKey, currentMgScore, currentMgData.length, diffInSec);
            
            document.getElementById('mgEndOverlay').style.display = 'flex';
            document.getElementById('mgFinalScore').innerHTML = `${currentMgData.length}問中 ${currentMgScore}問 正解！<br><span style="font-size:2rem;color:#718096;">タイム：${Math.floor(diffInSec/60)>0?Math.floor(diffInSec/60)+'分':''}${diffInSec%60}秒</span>`;
            
            const total = readScore + kanjiPracticeScore;
            const plays = Math.floor(total / 100) * 3 - minigamePlayCount;
            const btnContainer = document.getElementById('mgEndButtons');
            if (plays > 0) {
                btnContainer.innerHTML = `<div style="display:flex;gap:20px;"><button class="btn-blue" onclick="goToMinigameMenu()" style="font-size:1.8rem;background:#48bb78;">別のゲーム</button><button class="btn-blue" onclick="startMinigame('${currentMgType}', '${currentMgCategory || ''}')" style="font-size:1.8rem;">もう１回</button></div>`;
            } else {
                btnContainer.innerHTML = `<div style="font-size:1.5rem;color:#e53e3e;font-weight:bold;margin-bottom:20px;">あそべる回数がなくなりました。</div><button class="btn-blue" onclick="goToTopMode()" style="font-size:1.8rem;background:#718096;">トップへ</button>`;
            }
        };

        window.showEditDialog = () => { document.getElementById('editDialog').style.display = 'flex'; document.getElementById('passwordSection').style.display = 'block'; document.getElementById('editSection').style.display = 'none'; document.getElementById('passwordInput').value = ''; };
        window.closeEditDialog = () => { document.getElementById('editDialog').style.display = 'none'; };
        window.checkPassword = () => {
            if (document.getElementById('passwordInput').value === correctPassword) {
                document.getElementById('passwordSection').style.display = 'none';
                document.getElementById('editSection').style.display = 'flex';
                window.loadProblemEditor();
            } else window.showToast('パスワードが間違っています。');
        };

        window.loadProblemEditor = () => {
            const table = document.getElementById('spreadsheetTable');
            table.innerHTML = `<tr><th style="width:40px;background:#e5e7eb;">✓</th><th style="width:50px;background:#e5e7eb;">No.</th><th style="width:120px;background:#e5e7eb;">学年</th><th style="width:120px;background:#e5e7eb;">単元名</th><th style="background:#e5e7eb;">問題文</th></tr>`;
            for (let i = 0; i < Math.max(allProblems.length + 5, 15); i++) {
                const prob = allProblems[i] || { grade: '', unit: '', sentence: '' };
                const bg = i % 2 === 0 ? '#fff' : '#f9fafb';
                table.innerHTML += `<tr style="background:${bg};"><td style="text-align:center;border:1px solid #d1d5db;"><input type="checkbox" class="row-selector" data-row="${i}"></td><td style="text-align:center;border:1px solid #d1d5db;">${i+1}</td><td style="border:1px solid #d1d5db;"><input type="text" class="cell-input" data-row="${i}" data-col="grade" value="${prob.grade}" style="width:100%;border:none;outline:none;background:transparent;" onpaste="window.handlePaste(event)"></td><td style="border:1px solid #d1d5db;"><input type="text" class="cell-input" data-row="${i}" data-col="unit" value="${prob.unit}" style="width:100%;border:none;outline:none;background:transparent;" onpaste="window.handlePaste(event)"></td><td style="border:1px solid #d1d5db;"><input type="text" class="cell-input" data-row="${i}" data-col="sentence" value="${prob.sentence}" style="width:100%;border:none;outline:none;background:transparent;" onpaste="window.handlePaste(event)"></td></tr>`;
            }
        };

        document.addEventListener('keydown', (e) => {
            const fcPage = document.getElementById('flashcardPage');
            if (fcPage && fcPage.style.display === 'flex') {
                if (e.key === 'Enter' || e.key === 'ArrowDown') {
                    e.preventDefault();
                    window.nextFlashcard();
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    window.prevFlashcard();
                }
            }
            if (e.target && e.target.classList.contains('cell-input')) {
                const input = e.target;
                const row = parseInt(input.dataset.row);
                const col = input.dataset.col; 
                if (e.key === 'ArrowDown' || e.key === 'Enter') {
                    e.preventDefault();
                    const nextRow = document.querySelector(`.cell-input[data-row="${row+1}"][data-col="${col}"]`);
                    if (nextRow) nextRow.focus();
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    const prevRow = document.querySelector(`.cell-input[data-row="${row-1}"][data-col="${col}"]`);
                    if (prevRow) prevRow.focus();
                }
            }
        });

        window.handlePaste = (e) => {
            e.preventDefault();
            const rows = (e.clipboardData || window.clipboardData).getData('text').split(/\r\n|\n|\r/).filter(r => r.trim() !== '');
            let currentRow = parseInt(e.target.dataset.row);
            const startCol = e.target.dataset.col; 
            rows.forEach((rowData, rIdx) => {
                const cols = rowData.split('\t');
                if (cols.length >= 3 && startCol === 'grade') {
                    window.setVal(currentRow + rIdx, 'grade', cols[0]); window.setVal(currentRow + rIdx, 'unit', cols[1]); window.setVal(currentRow + rIdx, 'sentence', cols[2]);
                } else if (cols.length >= 2 && startCol === 'unit') {
                    window.setVal(currentRow + rIdx, 'unit', cols[0]); window.setVal(currentRow + rIdx, 'sentence', cols[1]);
                } else if (cols.length === 1) {
                    window.setVal(currentRow + rIdx, startCol, cols[0]);
                }
            });
        };
        window.setVal = (r, c, v) => { const el = document.querySelector(`.cell-input[data-row="${r}"][data-col="${c}"]`); if(el) el.value = v.trim(); };

        window.addRow = () => {
            const table = document.getElementById('spreadsheetTable');
            const rows = table.querySelectorAll('tr').length - 1;
            table.innerHTML += `<tr><td style="text-align:center;border:1px solid #d1d5db;"><input type="checkbox" class="row-selector" data-row="${rows}"></td><td style="text-align:center;border:1px solid #d1d5db;">${rows+1}</td><td style="border:1px solid #d1d5db;"><input type="text" class="cell-input" data-row="${rows}" data-col="grade" style="width:100%;border:none;outline:none;" onpaste="window.handlePaste(event)"></td><td style="border:1px solid #d1d5db;"><input type="text" class="cell-input" data-row="${rows}" data-col="unit" style="width:100%;border:none;outline:none;" onpaste="window.handlePaste(event)"></td><td style="border:1px solid #d1d5db;"><input type="text" class="cell-input" data-row="${rows}" data-col="sentence" style="width:100%;border:none;outline:none;" onpaste="window.handlePaste(event)"></td></tr>`;
        };
        window.deleteSelectedRows = () => { document.querySelectorAll('.row-selector:checked').forEach(c => { c.closest('tr').querySelectorAll('.cell-input').forEach(i => i.value = ''); c.checked = false; }); };
        window.clearAll = () => { document.querySelectorAll('.cell-input').forEach(i => i.value = ''); window.showToast('入力項目をクリアしました'); };
        
        window.saveProblems = () => {
            const newProbs = [];
            const inputs = Array.from(document.querySelectorAll('.cell-input'));
            for(let i=0; i<inputs.length; i+=3) {
                if(inputs[i+2].value.trim()) newProbs.push({ grade: inputs[i].value.trim() || '未分類', unit: inputs[i+1].value.trim() || '未分類', sentence: inputs[i+2].value.trim() });
            }
            if (newProbs.length > 0) { allProblems = newProbs; window.updateSelectors(); window.showToast('問題データを保存しました！'); }
        };
        window.saveAndReturn = () => { window.saveProblems(); window.closeEditDialog(); };

        window.loadFromUrl = async () => {
            const url = document.getElementById('spreadsheetUrl').value;
            if(!url) return;
            try {
                const sheetId = url.match(/\/d\/([a-zA-Z0-9-_]+)/)?.[1];
                const gid = url.match(/gid=([0-9]+)/)?.[1] || "0";
                const res = await fetch(`https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&gid=${gid}&t=${Date.now()}`);
                const text = await res.text();
                
                if (text.trim().startsWith('<!DOCTYPE html>') || text.includes('<html')) {
                    throw new Error("Invalid HTML response");
                }

                const rows = window.parseCSV(text);
                const newProbs = rows.slice(1).map(r => ({ grade: r[0]?.trim() || "未分類", unit: r[1]?.trim() || "未分類", sentence: r[2]?.trim() || "" })).filter(p => p.sentence);
                if (newProbs.length > 0) { allProblems = newProbs; window.updateSelectors(); window.loadProblemEditor(); window.showToast('問題データを読み込みました！'); }
            } catch(e) { window.showToast('読み込みに失敗しました。URLや共有設定を確認してください。'); }
        };

        window.addEventListener('resize', () => {
            const printPage = document.getElementById('printPage');
            if (printPage && printPage.style.display === 'flex') {
                window.adjustPrintPreviewScale();
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            window.loadProgressFromStorage();
            window.fetchProblems();
        });
  </script>
 </body>
</html>
