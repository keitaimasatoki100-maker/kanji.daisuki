<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漢字練習サイト</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            font-family: 'UD デジタル 教科書体 N-R', 'UD Digi Kyokasho N-R', 'UDデジタル教科書体 N-R', 'UDデジタル教科書体', '教科書体', 'Kyokasho', 'BIZ UDPGothic', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            writing-mode: vertical-rl;
            text-orientation: upright;
            padding-top: 10px;
            box-sizing: border-box;
            overflow-x: auto;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-height: 95vh;
            height: 100%;
            text-align: center;
            writing-mode: vertical-rl;
            text-orientation: upright;
            overflow-y: hidden;
            overflow-x: auto;
            margin-top: 0;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #cardsArea {
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            align-content: flex-start;
            height: 100%;
            overflow-x: auto;
            padding: 30px 0 10px 0;
        }
        
        .sentence-card {
            background: #f7fafc;
            border-radius: 15px;
            padding: 15px;
            margin: 25px 10px 10px 10px; /* 問題番号が隠れないように、上部の余白（margin）を広げました */
            border-top: 5px solid #667eea;
            writing-mode: vertical-rl;
            text-orientation: upright;
            display: inline-block;
            vertical-align: top;
            min-height: 400px;
            width: 60px;
            position: relative;
            flex-shrink: 0;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
        }
        
        .problem-number {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1rem;
            font-weight: bold;
            color: #667eea;
            background: white;
            padding: 2px 8px;
            border-radius: 12px;
            border: 2px solid #667eea;
            writing-mode: horizontal-tb;
            z-index: 20;
        }
        
        .sentence {
            font-size: 1.5rem;
            line-height: 1.8;
            color: #2d3748;
            margin-top: 15px;
        }
        
        .kanji-blank {
            display: inline-flex;
            flex-direction: row; 
            align-items: center;
            justify-content: center;
            width: 42px;
            min-height: 42px;
            border: 2px dashed #cbd5e0;
            border-radius: 8px;
            margin: 4px 2px;
            vertical-align: middle;
            background: white;
            position: relative;
            transition: all 0.3s ease;
            text-align: center;
            padding: 4px 0;
        }
        
        .kanji-blank::before {
            content: attr(data-reading);
            position: absolute;
            right: -28px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.8rem;
            color: #2d3748;
            background: #e2e8f0;
            padding: 4px 2px;
            border-radius: 4px;
            white-space: nowrap;
            font-weight: bold;
        }
        
        .kanji-blank.revealed {
            border: 2px solid #48bb78;
            background: #f0fff4;
            color: #2d3748;
            font-weight: bold;
        }

        .reveal-btn {
            background: linear-gradient(135deg, #48bb78, #38a169);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            writing-mode: vertical-rl;
        }
        
        .individual-btn {
            position: absolute;
            left: -14px;
            top: 50%;
            transform: translateY(-50%);
            padding: 8px 3px;
            font-size: 0.65rem;
            border-radius: 12px;
            writing-mode: vertical-rl;
            text-orientation: upright;
            z-index: 10;
            line-height: 1.1;
            white-space: nowrap;
        }
        
        .controls {
            margin-right: 20px;
            display: flex;
            /* 縦書き環境で row を指定すると上から下へ要素が並びます */
            flex-direction: row;
            align-items: center;
            gap: 20px;
            writing-mode: vertical-rl;
            padding-top: 10px; /* 上部からの余白 */
        }

        #editDialog {
            writing-mode: horizontal-tb;
        }

        .dojo-title {
            color: #2d3748;
            font-size: 1.8rem;
            font-weight: 900;
            margin-right: 40px;
            padding: 10px;
            border-left: 4px double #4a5568;
            background-color: rgba(247, 250, 252, 0.5);
            border-radius: 0 0 10px 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ヘッダー設定エリア -->
        <div style="position: absolute; top: 15px; right: 15px; display: flex; flex-direction: row; align-items: flex-start; gap: 15px; writing-mode: vertical-rl; text-orientation: upright; z-index: 100;">
            <!-- 学年セレクター -->
            <select id="gradeSelector" onchange="onGradeChange()" style="background: white; border: 2px solid #cbd5e0; border-radius: 12px; padding: 8px 12px; font-size: 0.7rem; font-weight: bold; cursor: pointer; writing-mode: vertical-rl; min-width: 60px;">
                <option value="">学年を選択...</option>
            </select>

            <!-- 単元セレクター（学年に連動し、シート順に表示） -->
            <select id="unitSelector" onchange="onUnitChange()" style="background: white; border: 2px solid #cbd5e0; border-radius: 12px; padding: 8px 12px; font-size: 0.7rem; font-weight: bold; cursor: pointer; writing-mode: vertical-rl; min-width: 60px; margin-top: 10px;">
                <option value="">単元を選択...</option>
            </select>

            <select id="rangeSelector" onchange="onRangeChange()" style="background: white; border: 2px solid #cbd5e0; border-radius: 12px; padding: 8px 12px; font-size: 0.7rem; font-weight: bold; cursor: pointer; writing-mode: vertical-rl; min-width: 40px; margin-top: 10px;">
                <option value="up-to">まで</option>
                <option value="only" selected>だけ</option>
            </select>
        </div>

        <div style="margin-right: 110px;"></div>

        <div class="dojo-title">
            最強！漢字道場
        </div>

        <!-- カード表示エリア -->
        <div id="cardsArea"></div>

        <!-- コントロール（縦並び） -->
        <div class="controls">
            <button class="reveal-btn" onclick="shuffleProblems()" style="background: linear-gradient(135deg, #3b82f6, #1d4ed8);">シャッフル</button>
            <button class="reveal-btn" id="globalToggleBtn" onclick="toggleAllReveals()">すべて表示</button>
            <button class="reveal-btn" onclick="showEditDialog()" style="background: linear-gradient(135deg, #f56565, #e53e3e);">問題編集</button>
        </div>
    </div>

    <!-- 編集ダイアログ -->
    <div id="editDialog" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-[1000] p-4">
        <div class="bg-white p-6 rounded-2xl max-w-5xl w-full max-h-[90vh] overflow-auto flex flex-col">
            <h2 class="text-xl font-bold text-gray-700 mb-4 text-center">問題編集 - スプレッドシート</h2>
            
            <div id="passwordSection">
                <label class="block mb-2 font-bold">パスワード:</label>
                <input type="password" id="passwordInput" class="w-full p-2 border-2 rounded-lg mb-4" onkeypress="if(event.key==='Enter') checkPassword()">
                <div class="flex gap-2">
                    <button onclick="checkPassword()" class="bg-green-500 text-white px-4 py-2 rounded-lg">確認</button>
                    <button onclick="closeEditDialog()" class="bg-gray-200 px-4 py-2 rounded-lg">キャンセル</button>
                </div>
            </div>

            <div id="editSection" class="hidden flex-1 flex flex-col overflow-hidden">
                <div class="bg-blue-50 p-4 rounded-xl border-2 border-blue-200 mb-4">
                    <label class="block font-bold text-blue-800 mb-2">📊 GoogleスプレッドシートURL:</label>
                    <div class="flex gap-2">
                        <input type="text" id="spreadsheetUrl" placeholder="スプレッドシートのURLを貼り付け" class="flex-1 p-2 border rounded">
                        <button onclick="loadFromUrl()" class="bg-blue-500 text-white px-4 py-2 rounded">読み込む</button>
                    </div>
                    <p class="text-xs text-blue-600 mt-2">
                        ※共有設定を「リンクを知っている全員」にしてください。<br>
                        ※A列: 学年, B列: 単元名, C列: 問題文（5秒ごとに自動更新チェック）。
                    </p>
                </div>

                <div class="flex-1 overflow-auto border-2 rounded-xl">
                    <table id="spreadsheetTable" class="w-full text-left border-collapse">
                    </table>
                </div>

                <div class="flex gap-2 mt-4 justify-center">
                    <button onclick="saveAndReturn()" class="bg-blue-600 text-white px-6 py-2 rounded-xl font-bold">💾 保存して戻る</button>
                    <button onclick="addRow()" class="bg-gray-500 text-white px-4 py-2 rounded-xl">行を追加</button>
                    <button onclick="clearAll()" class="bg-gray-300 px-4 py-2 rounded-xl">クリア</button>
                    <button onclick="closeEditDialog()" class="bg-gray-100 px-4 py-2 rounded-xl">閉じる</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 設定: パスワードとデフォルトURL
        const correctPassword = "kanji";
        const DEFAULT_SHEET_URL = "https://docs.google.com/spreadsheets/d/1a2CyIJCM5Nqy6Hah6249_Era1jyw11QmhAIJQGzoesA/edit?gid=649883566#gid=649883566";
        
        let autoUpdateInterval = null;
        let lastRawData = ""; 
        let isSettingsLoaded = false;

        // 学年の並び順定義
        const unitOrder = ["小学1年生", "小学2年生", "小学3年生", "小学4年生", "小学5年生", "小学6年生", "中学1年生", "中学2年生", "中学3年生"];

        let problems = [];
        let displayProblems = [];

        async function init() {
            // ローカルストレージから前回保存したURLがあればそれを使う
            const savedUrl = localStorage.getItem('kanji_app_sheet_url');
            document.getElementById('spreadsheetUrl').value = savedUrl || DEFAULT_SHEET_URL;
            
            // 初回読み込み
            await loadFromUrl(true); 
        }

        // ユーザー設定の保存 (localStorage)
        const saveUserSetting = () => {
            const settings = {
                grade: document.getElementById('gradeSelector').value,
                unit: document.getElementById('unitSelector').value,
                range: document.getElementById('rangeSelector').value
            };
            try {
                localStorage.setItem('kanji_app_settings', JSON.stringify(settings));
            } catch (e) {
                console.error("設定の保存に失敗しました:", e);
            }
        };

        // ユーザー設定の復元 (localStorage)
        const restoreUserSetting = () => {
            if (isSettingsLoaded) return;
            try {
                const settingsJson = localStorage.getItem('kanji_app_settings');
                if (settingsJson) {
                    const data = JSON.parse(settingsJson);
                    const gradeSelector = document.getElementById('gradeSelector');
                    const unitSelector = document.getElementById('unitSelector');
                    const rangeSelector = document.getElementById('rangeSelector');

                    // 学年セレクターの復元
                    if ([...gradeSelector.options].some(o => o.value === data.grade)) {
                        gradeSelector.value = data.grade;
                    }
                    
                    // 学年に応じて単元セレクターを更新
                    updateUnitSelector();
                    
                    // 単元セレクターの復元
                    if ([...unitSelector.options].some(o => o.value === data.unit)) {
                        unitSelector.value = data.unit;
                    }
                    
                    // 範囲セレクターの復元
                    if ([...rangeSelector.options].some(o => o.value === data.range)) {
                        rangeSelector.value = data.range;
                    }
                }
            } catch (e) {
                console.error("設定の読み込みに失敗しました:", e);
            } finally {
                isSettingsLoaded = true;
                filterByUnit(); // 設定の有無に関わらず初期描画を実行する
            }
        };

        function updateGradeSelector() {
            const gradeSelector = document.getElementById('gradeSelector');
            const currentGradeValue = gradeSelector.value;
            
            // ユニークな学年を抽出し、unitOrderの定義順にソート
            const grades = [...new Set(problems.map(p => p.grade))].sort((a,b) => {
                const idxA = unitOrder.indexOf(a);
                const idxB = unitOrder.indexOf(b);
                if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                return a.localeCompare(b, 'ja');
            });

            gradeSelector.innerHTML = '<option value="">学年を選択...</option>';
            grades.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g;
                opt.textContent = g;
                gradeSelector.appendChild(opt);
            });
            
            // 以前の選択状態を復元（もし選択肢にあれば）
            if (currentGradeValue && [...gradeSelector.options].some(o => o.value === currentGradeValue)) {
                gradeSelector.value = currentGradeValue;
            } else {
                gradeSelector.value = '';
            }
        }

        function updateUnitSelector() {
            const gradeSelector = document.getElementById('gradeSelector');
            const unitSelector = document.getElementById('unitSelector');
            const selectedGrade = gradeSelector.value;
            const currentVal = unitSelector.value;

            if (!selectedGrade) {
                unitSelector.innerHTML = '<option value="">単元を選択...</option>';
                unitSelector.disabled = true;
                unitSelector.style.opacity = '0.5';
                return;
            } else {
                unitSelector.disabled = false;
                unitSelector.style.opacity = '1';
            }

            // 選択された学年の問題から単元を抽出
            const filteredForUnits = selectedGrade === 'all' 
                ? problems 
                : problems.filter(p => p.grade === selectedGrade);
            
            // 重複なしの単元リストを作成（スプレッドシートの並び順を維持）
            const units = [];
            filteredForUnits.forEach(p => {
                if (!units.includes(p.unit)) {
                    units.push(p.unit);
                }
            });

            unitSelector.innerHTML = '<option value="">単元を選択...</option>';
            units.forEach(u => {
                const opt = document.createElement('option');
                opt.value = u;
                opt.textContent = u;
                unitSelector.appendChild(opt);
            });

            if (currentVal && [...unitSelector.options].some(o => o.value === currentVal)) {
                unitSelector.value = currentVal;
            } else {
                unitSelector.value = '';
            }
        }

        function onGradeChange() {
            const unitSelector = document.getElementById('unitSelector');
            unitSelector.value = ''; // 学年が変わったら単元は未選択にリセット
            updateUnitSelector();
            filterByUnit();
            saveUserSetting();
        }

        function onUnitChange() {
            filterByUnit();
            saveUserSetting();
        }

        function onRangeChange() {
            filterByUnit();
            saveUserSetting();
        }

        function renderCards() {
            const area = document.getElementById('cardsArea');
            area.innerHTML = '';

            const grade = document.getElementById('gradeSelector').value;
            const unit = document.getElementById('unitSelector').value;

            if (!grade) {
                area.innerHTML = '<div style="margin: auto; color: #a0aec0; font-size: 1.5rem; font-weight: bold; writing-mode: vertical-rl; text-orientation: upright; padding: 20px; letter-spacing: 2px;">学年を選択してください</div>';
                return;
            }

            if (!unit) {
                area.innerHTML = '<div style="margin: auto; color: #a0aec0; font-size: 1.5rem; font-weight: bold; writing-mode: vertical-rl; text-orientation: upright; padding: 20px; letter-spacing: 2px;">単元を選択してください</div>';
                return;
            }

            displayProblems.forEach((p, idx) => {
                const card = document.createElement('div');
                card.className = 'sentence-card';
                
                const num = document.createElement('div');
                num.className = 'problem-number';
                num.textContent = idx + 1;
                card.appendChild(num);

                const sentence = document.createElement('div');
                sentence.className = 'sentence';
                
                const parts = p.sentence.split(/(\{.+?\|.+?\})/);
                parts.forEach((part, pIdx) => {
                    if (part.startsWith('{')) {
                        const content = part.slice(1, -1).split('|');
                        const kanji = content[0];
                        const reading = content[1];
                        const blankId = `blank-${idx}-${pIdx}`;
                        
                        const blank = document.createElement('span');
                        blank.className = 'kanji-blank';
                        blank.id = blankId;
                        blank.setAttribute('data-kanji', kanji);
                        blank.setAttribute('data-reading', reading);
                        blank.innerHTML = `<button class="reveal-btn individual-btn" onclick="revealKanji('${blankId}')">答え</button>`;
                        
                        sentence.appendChild(blank);
                    } else {
                        sentence.appendChild(document.createTextNode(part));
                    }
                });

                card.appendChild(sentence);
                area.appendChild(card);
            });
        }

        // KanjiVGからSVGを取得してアニメーション描画を3回ループ
        async function revealKanji(id) {
            const blank = document.getElementById(id);
            if (!blank) return;

            if (!blank.classList.contains('revealed')) {
                const kanji = blank.getAttribute('data-kanji');
                blank.classList.add('revealed');
                
                // アニメーションキャンセルのためのID
                const animId = Date.now().toString();
                blank.dataset.animId = animId;

                blank.innerHTML = `<span style="font-size: 0.6rem; color: #a0aec0; text-orientation: upright; margin: auto;">取得中</span>`;

                const kanjiContainer = document.createElement('div');
                kanjiContainer.style.display = 'flex';
                kanjiContainer.style.flexDirection = 'row'; // 縦書き環境で上から下へ並べる
                kanjiContainer.style.alignItems = 'center';
                kanjiContainer.style.justifyContent = 'center';
                kanjiContainer.style.gap = '2px';

                const promises = Array.from(kanji).map(async (char) => {
                    // 漢字だけでなく、ひらがな・カタカナもフェッチ対象にする
                    const isTarget = /[\u4e00-\u9faf\u3400-\u4dbf\u3040-\u309f\u30a0-\u30ff]/.test(char);
                    if (!isTarget) return char;

                    const code = char.charCodeAt(0).toString(16).padStart(5, '0');
                    const url = `https://cdn.jsdelivr.net/gh/KanjiVG/kanjivg@master/kanji/${code}.svg`;
                    
                    try {
                        const res = await fetch(url);
                        if (res.ok) {
                            const svgText = await res.text();
                            const wrapper = document.createElement('div');
                            wrapper.innerHTML = svgText;
                            const svg = wrapper.querySelector('svg');
                            if (svg) {
                                svg.querySelectorAll('text').forEach(t => t.remove());
                                svg.style.width = '34px';
                                svg.style.height = '34px';
                                svg.style.display = 'block';
                                return svg;
                            }
                        }
                    } catch (e) {
                        console.error('SVG Load error', e);
                    }
                    return char; 
                });

                const results = await Promise.all(promises);

                // もし取得中に「答え」が再度押されて隠されていたら終了
                if (blank.dataset.animId !== animId) return;

                blank.innerHTML = '';
                const elements = [];

                // DOMに要素を追加しつつ、アニメーション用リストを作る
                results.forEach((result) => {
                    if (typeof result === 'string') {
                        const span = document.createElement('span');
                        span.textContent = result;
                        span.style.fontSize = '1.5rem';
                        span.style.fontWeight = 'bold';
                        span.style.textOrientation = 'upright';
                        span.style.opacity = '0'; // アニメーション開始までは見えないようにする
                        elements.push({ type: 'text', el: span });
                        kanjiContainer.appendChild(span);
                    } else {
                        const paths = Array.from(result.querySelectorAll('path'));
                        paths.forEach(path => {
                            path.style.fill = 'none';
                            path.style.stroke = '#2d3748';
                            path.style.strokeWidth = '3';
                            path.style.strokeLinecap = 'round';
                            path.style.strokeLinejoin = 'round';
                            const length = path.getTotalLength();
                            path.style.strokeDasharray = length;
                            path.style.strokeDashoffset = length;
                        });
                        elements.push({ type: 'svg', el: result, paths: paths });
                        kanjiContainer.appendChild(result);
                    }
                });

                const hideBtn = document.createElement('button');
                hideBtn.className = 'reveal-btn individual-btn';
                hideBtn.textContent = '答え'; // もう一度押せるようにテキストを「答え」に維持
                hideBtn.onclick = (e) => {
                    e.stopPropagation();
                    revealKanji(id);
                };

                blank.appendChild(kanjiContainer);
                blank.appendChild(hideBtn);

                // アニメーションを3回ループする処理
                const playAnimation = async () => {
                    // まず初期状態（見えない状態）にする
                    elements.forEach(item => {
                        if (item.type === 'text') {
                            item.el.getAnimations().forEach(a => a.cancel()); // アニメーションをリセット
                            item.el.style.opacity = '0';
                        } else {
                            item.paths.forEach(p => {
                                p.getAnimations().forEach(a => a.cancel()); // アニメーションをリセット
                                p.style.strokeDashoffset = p.getTotalLength();
                            });
                        }
                    });

                    await new Promise(r => setTimeout(r, 300));

                    for (let loop = 0; loop < 3; loop++) {
                        // キャンセルチェック
                        if (blank.dataset.animId !== animId) return;

                        // 順番に描画（アニメーション）
                        for (const item of elements) {
                            if (blank.dataset.animId !== animId) return;

                            if (item.type === 'text') {
                                // テキストはフェードイン
                                const anim = item.el.animate([
                                    { opacity: 0 },
                                    { opacity: 1 }
                                ], { duration: 250, fill: 'forwards' });
                                await anim.finished;
                                item.el.style.opacity = '1';
                            } else {
                                // SVGの各画を順番に描画
                                for (const path of item.paths) {
                                    if (blank.dataset.animId !== animId) return;
                                    const anim = path.animate([
                                        { strokeDashoffset: path.getTotalLength() },
                                        { strokeDashoffset: 0 }
                                    ], { duration: 250, easing: 'ease-out', fill: 'forwards' });
                                    await anim.finished;
                                    path.style.strokeDashoffset = '0';
                                }
                            }
                            // 1文字描き終わったら少し待つ
                            await new Promise(r => setTimeout(r, 200));
                        }

                        // 1回全体が書き終わったら少し待機
                        await new Promise(r => setTimeout(r, 1500));

                        // 最後のループが終わったらリセットせずに終了（答えを表示したままにする）
                        if (loop === 2) break;

                        // すべての字を完全に消す（リセット）
                        elements.forEach(item => {
                            if (item.type === 'text') {
                                item.el.getAnimations().forEach(a => a.cancel()); // アニメーションをリセット
                                item.el.style.opacity = '0';
                            } else {
                                item.paths.forEach(p => {
                                    p.getAnimations().forEach(a => a.cancel()); // アニメーションをリセット
                                    p.style.strokeDashoffset = p.getTotalLength();
                                });
                            }
                        });

                        // 字が消えた状態で少し待つ
                        await new Promise(r => setTimeout(r, 500));
                    }
                };

                // アニメーションを開始
                playAnimation();

            } else {
                // 隠す処理 (もう一度「答え」が押されたとき)
                blank.dataset.animId = ""; // 進行中のアニメーションをキャンセル
                blank.innerHTML = `<button class="reveal-btn individual-btn" onclick="revealKanji('${id}')">答え</button>`;
                blank.classList.remove('revealed');
            }
        }

        function toggleAllReveals() {
            const btn = document.getElementById('globalToggleBtn');
            const blanks = document.querySelectorAll('.kanji-blank');
            const isShowingAll = btn.textContent === 'すべて隠す';

            blanks.forEach((b, i) => {
                const revealed = b.classList.contains('revealed');
                if (!isShowingAll && !revealed) {
                    setTimeout(() => revealKanji(b.id), i * 100);
                }
                if (isShowingAll && revealed) {
                    revealKanji(b.id);
                }
            });

            btn.textContent = isShowingAll ? 'すべて表示' : 'すべて隠す';
        }

        function shuffleProblems() {
            displayProblems.sort(() => Math.random() - 0.5);
            renderCards();
        }

        function filterByUnit() {
            const grade = document.getElementById('gradeSelector').value;
            const unit = document.getElementById('unitSelector').value;
            const range = document.getElementById('rangeSelector').value;

            if (!grade || !unit) {
                displayProblems = [];
                renderCards();
                return;
            }

            let filtered = [...problems];

            if (grade !== 'all') {
                filtered = filtered.filter(p => p.grade === grade);
            }

            if (unit !== 'all') {
                if (range === 'only') {
                    filtered = filtered.filter(p => p.unit === unit);
                } else {
                    const currentUnits = [];
                    filtered.forEach(p => {
                        if(!currentUnits.includes(p.unit)) currentUnits.push(p.unit);
                    });
                    const targetIdx = currentUnits.indexOf(unit);
                    filtered = filtered.filter(p => currentUnits.indexOf(p.unit) <= targetIdx);
                }
            }

            // 50問制限: 51問以上の場合はランダムに50問選出
            if (filtered.length > 50) {
                filtered = filtered.sort(() => Math.random() - 0.5).slice(0, 50);
            }

            displayProblems = filtered;
            renderCards();
        }

        function showEditDialog() { document.getElementById('editDialog').classList.remove('hidden'); }
        function closeEditDialog() { document.getElementById('editDialog').classList.add('hidden'); }

        function checkPassword() {
            if (document.getElementById('passwordInput').value === correctPassword) {
                document.getElementById('passwordSection').classList.add('hidden');
                document.getElementById('editSection').classList.remove('hidden');
                createSpreadsheet();
            } else {
                alert('パスワードが違います');
            }
        }

        function createSpreadsheet() {
            const table = document.getElementById('spreadsheetTable');
            table.innerHTML = `<tr class="bg-gray-100"><th class="p-2 border">学年</th><th class="p-2 border">単元名</th><th class="p-2 border">問題文</th></tr>`;
            problems.forEach((p, i) => addRow(p.grade, p.unit, p.sentence));
        }

        function addRow(grade = "", unit = "", sentence = "") {
            const table = document.getElementById('spreadsheetTable');
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="border"><input type="text" class="w-full p-2 edit-grade-input" value="${grade}"></td>
                <td class="border"><input type="text" class="w-full p-2 edit-unit-input" value="${unit}"></td>
                <td class="border"><input type="text" class="w-full p-2 edit-sentence-input" value="${sentence}"></td>
            `;
            table.appendChild(tr);
        }

        function saveAndReturn() {
            const grades = document.querySelectorAll('.edit-grade-input');
            const units = document.querySelectorAll('.edit-unit-input');
            const sents = document.querySelectorAll('.edit-sentence-input');
            problems = [];
            grades.forEach((g, i) => {
                if (sents[i].value) {
                    problems.push({ 
                        grade: g.value || "未分類", 
                        unit: units[i].value || "未分類", 
                        sentence: sents[i].value 
                    });
                }
            });
            lastRawData = ""; 
            updateGradeSelector();
            updateUnitSelector();
            filterByUnit();
            closeEditDialog();
        }

        async function loadFromUrl(isInitial = false) {
            let url = document.getElementById('spreadsheetUrl').value;
            if (!url) return;
            
            // URLをローカルストレージに保存
            localStorage.setItem('kanji_app_sheet_url', url);

            const sheetId = url.match(/\/d\/([a-zA-Z0-9-_]+)/)?.[1];
            const gid = url.match(/gid=([0-9]+)/)?.[1] || "0";
            
            if (!sheetId) return alert('URLが無効です');
            
            // GitHub Pages等の外部からのアクセス用にGoogle Visualization APIを使用
            const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&gid=${gid}`;
            
            const fetchData = async () => {
                try {
                    // キャッシュ回避
                    const res = await fetch(`${csvUrl}&t=${new Date().getTime()}`);
                    if (!res.ok) return;
                    const data = await res.text();
                    
                    if (data === lastRawData) return;
                    lastRawData = data;

                    // Google Visualization APIのCSVはダブルクォートで囲まれることがあるため除去
                    const rows = data.split('\n').map(r => {
                        // 簡易CSVパース
                        const matches = r.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || [];
                        if (matches.length === 0) return r.split(',');
                        return matches.map(m => m.replace(/^"|"$/g, '').replace(/""/g, '"'));
                    });
                    
                    // ヘッダーを除去してデータをマッピング
                    problems = rows.slice(1).map(r => ({
                        grade: r[0]?.trim() || "未分類",
                        unit: r[1]?.trim() || "未分類",
                        sentence: r[2]?.trim() || ""
                    })).filter(p => p.sentence && p.sentence !== "");
                    
                    if (document.getElementById('editDialog').classList.contains('hidden') || isInitial) {
                        updateGradeSelector();
                        updateUnitSelector();
                        
                        if (isInitial) {
                            restoreUserSetting();
                        } else {
                            // 自動更新時はユーザーの選択状態を維持したまま再描画
                            filterByUnit();
                        }
                    }
                } catch (e) { 
                    console.error("Data Fetch Error:", e); 
                }
            };

            await fetchData();

            // 5秒間隔で更新チェック
            if (autoUpdateInterval) clearInterval(autoUpdateInterval);
            autoUpdateInterval = setInterval(fetchData, 5000);
        }

        function clearAll() {
            problems = [];
            createSpreadsheet();
        }

        init();
    </script>
</body>
</html>
